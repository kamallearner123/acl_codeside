{% if avatar_url %}
<img src="{{ avatar_url }}" alt="{{ display_name }}"
     style="width:32px;height:32px;border-radius:50%;object-fit:cover;display:inline-block;vertical-align:middle;"
     class="w-8 h-8 rounded-full object-cover inline-block align-middle">
{% else %}
<span style="width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#1E3557;color:#fff;font-weight:700;vertical-align:middle;font-size:13px;"
      class="w-8 h-8 rounded-full inline-flex items-center justify-center bg-brand-navy text-white font-bold text-xs align-middle select-none">
    {{ display_name|first|upper }}
</span>
{% endif %}

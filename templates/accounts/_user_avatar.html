{% if avatar_url %}
<img src="{{ avatar_url }}" alt="" aria-hidden="true"
     style="width:36px;height:36px;border-radius:50%;object-fit:cover;display:block;">
{% else %}
<span aria-hidden="true"
      style="width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#1E3557;color:#fff;font-weight:700;">
    {{ display_name|first|upper }}
</span>
{% endif %}

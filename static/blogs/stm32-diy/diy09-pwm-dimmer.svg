<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.12" />
        </filter>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#CBD5E1" opacity="0.6"/>
        </pattern>
        <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284C7"/>
            <stop offset="100%" stop-color="#0369A1"/>
        </linearGradient>
        <linearGradient id="breadboardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#F8FAFC"/>
            <stop offset="100%" stop-color="#F1F5F9"/>
        </linearGradient>
    </defs>
    <!-- Background Canvas -->
    <rect width="800" height="480" fill="#F8FAFC" />
    <rect width="800" height="480" fill="url(#grid)" />
    <!-- Header Banner -->
    <rect x="0" y="0" width="800" height="42" fill="#0F172A" />
    <text x="24" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">STM32 EMBEDDED WIRING SCHEMATIC &bull; ASSIGNMENT 9: PWM LED DIMMER (ADC PA0 & TIM3_CH3 PB0)</text>
    <rect x="0" y="42" width="800" height="3" fill="#FF5B5B" />

    <!-- STM32 Pin Header Block: STM32F446RE PINS -->
    <g transform="translate(45,80)" filter="url(#shadow)">
        <rect width="260" height="320" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
        <rect x="0" y="0" width="260" height="32" rx="8" fill="#1E293B"/>
        <rect x="0" y="24" width="260" height="8" fill="#1E293B"/>
        <text x="130.0" y="21" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">STM32F446RE PINS</text>
    
        <!-- Pin: PA0 -->
        <rect x="8" y="36.0" width="230" height="24" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
        <text x="16" y="52.0" fill="#F59E0B" font-family="monospace" font-size="11" font-weight="bold">PA0</text>
        <text x="64" y="51.5" fill="#CBD5E1" font-family="sans-serif" font-size="9">(ADC1_IN0 Potentiometer)</text>
        <!-- Contact pad on far right edge -->
        <circle cx="244" cy="48.0" r="6" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="244" cy="48.0" r="2" fill="#0F172A"/>
        
        <!-- Pin: PB0 -->
        <rect x="8" y="105.0" width="230" height="24" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
        <text x="16" y="121.0" fill="#10B981" font-family="monospace" font-size="11" font-weight="bold">PB0</text>
        <text x="64" y="120.5" fill="#CBD5E1" font-family="sans-serif" font-size="9">(TIM3_CH3 PWM LED Out)</text>
        <!-- Contact pad on far right edge -->
        <circle cx="244" cy="117.0" r="6" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="244" cy="117.0" r="2" fill="#0F172A"/>
        
        <!-- Pin: 3.3V -->
        <rect x="8" y="174.0" width="230" height="24" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
        <text x="16" y="190.0" fill="#EF4444" font-family="monospace" font-size="11" font-weight="bold">3.3V</text>

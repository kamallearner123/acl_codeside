<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.12" />
        </filter>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#CBD5E1" opacity="0.6"/>
        </pattern>
        <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284C7"/>
            <stop offset="100%" stop-color="#0369A1"/>
        </linearGradient>
        <linearGradient id="breadboardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#F8FAFC"/>
            <stop offset="100%" stop-color="#F1F5F9"/>
        </linearGradient>
    </defs>
    <!-- Background Canvas -->
    <rect width="800" height="480" fill="#F8FAFC" />
    <rect width="800" height="480" fill="url(#grid)" />
    <!-- Header Banner -->
    <rect x="0" y="0" width="800" height="42" fill="#0F172A" />
    <text x="24" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">STM32 EMBEDDED WIRING SCHEMATIC &bull; ASSIGNMENT 5: REACTION-TIME MEASUREMENT (PA5 & PA0)</text>
    <rect x="0" y="42" width="800" height="3" fill="#FF5B5B" />

    <!-- Pin Header Block: STM32F446RE PINS -->
    <g transform="translate(60,80)" filter="url(#shadow)">
        <rect width="230" height="320" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
        <rect x="0" y="0" width="230" height="24" rx="6" fill="#0F172A"/>
        <text x="115.0" y="16" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">STM32F446RE PINS</text>
    
        <circle cx="12" cy="36.0" r="5" fill="#F59E0B" stroke="#78350F" stroke-width="1"/>
        <circle cx="12" cy="36.0" r="2" fill="#0F172A"/>
        <text x="24" y="40.0" fill="#F1F5F9" font-family="monospace" font-size="10" font-weight="600" text-anchor="start">PA5  (Random LED &bull; TIM2_CH1)</text>
        
        <circle cx="12" cy="93.6" r="5" fill="#F59E0B" stroke="#78350F" stroke-width="1"/>
        <circle cx="12" cy="93.6" r="2" fill="#0F172A"/>
        <text x="24" y="97.6" fill="#F1F5F9" font-family="monospace" font-size="10" font-weight="600" text-anchor="start">PA0  (Slap Button &bull; EXTI0)</text>
        
        <circle cx="12" cy="151.2" r="5" fill="#F59E0B" stroke="#78350F" stroke-width="1"/>
        <circle cx="12" cy="151.2" r="2" fill="#0F172A"/>
        <text x="24" y="155.2" fill="#F1F5F9" font-family="monospace" font-size="10" font-weight="600" text-anchor="start">PA2  (USART2_TX  &bull; 115200)</text>
        
        <circle cx="12" cy="208.8" r="5" fill="#F59E0B" stroke="#78350F" stroke-width="1"/>
        <circle cx="12" cy="208.8" r="2" fill="#0F172A"/>
        <text x="24" y="212.8" fill="#F1F5F9" font-family="monospace" font-size="10" font-weight="600" text-anchor="start">3.3V (VDD Supply)</text>
        
        <circle cx="12" cy="266.4" r="5" fill="#F59E0B" stroke="#78350F" stroke-width="1"/>
        <circle cx="12" cy="266.4" r="2" fill="#0F172A"/>
        <text x="24" y="270.4" fill="#F1F5F9" font-family="monospace" font-size="10" font-weight="600" text-anchor="start">GND  (Common Ground)</text>
        </g>
    <!-- Breadboard Area -->
    <g transform="translate(340,80)" filter="url(#shadow)">
        <rect width="400" height="320" rx="8" fill="url(#breadboardGrad)" stroke="#CBD5E1" stroke-width="2"/>
        <line x1="15" y1="12" x2="385" y2="12" stroke="#EF4444" stroke-width="2" stroke-dasharray="8,4"/>
        <line x1="15" y1="20" x2="385" y2="20" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8,4"/>
        <text x="6" y="15" fill="#EF4444" font-family="monospace" font-size="11" font-weight="bold">+</text>
        <text x="6" y="23" fill="#3B82F6" font-family="monospace" font-size="11" font-weight="bold">-</text>
        
        <line x1="15" y1="300" x2="385" y2="300" stroke="#EF4444" stroke-width="2" stroke-dasharray="8,4"/>
        <line x1="15" y1="308" x2="385" y2="308" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8,4"/>
        <text x="6" y="303" fill="#EF4444" font-family="monospace" font-size="11" font-weight="bold">+</text>
        <text x="6" y="311" fill="#3B82F6" font-family="monospace" font-size="11" font-weight="bold">-</text>
        <rect x="15" y="156.0" width="370" height="8" fill="#E2E8F0" rx="2"/>
    </g>
    
    <g transform="translate(460,180)">
        <circle cx="0" cy="0" r="12" fill="#EF4444" opacity="0.85" stroke="#0F172A" stroke-width="1.5"/>
        <circle cx="-3" cy="-3" r="4" fill="#FFFFFF" opacity="0.6"/>
        <line x1="11" y1="-7" x2="11" y2="7" stroke="#0F172A" stroke-width="2"/>
        <line x1="-6" y1="12" x2="-6" y2="28" stroke="#94A3B8" stroke-width="2.5"/>
        <line x1="6" y1="12" x2="6" y2="28" stroke="#94A3B8" stroke-width="2.5"/>
        <text x="-6" y="40" fill="#0F172A" font-family="monospace" font-size="8" text-anchor="middle">(+)Anode</text>
        <text x="14" y="40" fill="#0F172A" font-family="monospace" font-size="8" text-anchor="middle">(-)Cathode</text>
        <text x="0" y="-16" fill="#0F172A" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Trigger (PA5)</text>
    </g>
    
        <g transform="translate(540,180)">
            <line x1="-25" y1="0" x2="25" y2="0" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
            <rect x="-14" y="-6" width="28" height="12" rx="3" fill="#FDE68A" stroke="#D97706" stroke-width="1.2"/>
            <rect x="-8" y="-6" width="3" height="12" fill="#B45309"/>
            <rect x="-2" y="-6" width="3" height="12" fill="#B45309"/>
            <rect x="4" y="-6" width="3" height="12" fill="#78350F"/>
            <text x="0" y="-10" fill="#0F172A" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">330 &Omega;</text>
        </g>
        
    <g transform="translate(460,300)">
        <rect x="-18" y="-18" width="36" height="36" rx="4" fill="#334155" stroke="#0F172A" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="10" fill="#0284C7" stroke="#0369A1" stroke-width="1.5"/>
        <rect x="-24" y="-12" width="6" height="4" fill="#94A3B8"/>
        <rect x="-24" y="8" width="6" height="4" fill="#94A3B8"/>
        <rect x="18" y="-12" width="6" height="4" fill="#94A3B8"/>
        <rect x="18" y="8" width="6" height="4" fill="#94A3B8"/>
        <text x="-26" y="-7" fill="#64748B" font-family="monospace" font-size="8" text-anchor="end">Pin 1</text>
        <text x="26" y="-7" fill="#64748B" font-family="monospace" font-size="8">Pin 2</text>
        <text x="0" y="-22" fill="#0F172A" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Response (PA0)</text>
    </g>
    
    <g>
        <path d="M 72 116.0 C 263.0 116.0, 263.0 180, 454 180" fill="none" stroke="#EF4444" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
        <circle cx="72" cy="116.0" r="3.5" fill="#EF4444"/>
        <circle cx="454" cy="180" r="3.5" fill="#EF4444"/>
    
        <rect x="235.0" y="132.0" width="56" height="15" rx="3" fill="#FFFFFF" stroke="#EF4444" stroke-width="1" opacity="0.9"/>
        <text x="263.0" y="143.0" fill="#EF4444" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">PA5 Output</text>
        </g>
    <g>
        <path d="M 565 180 C 318.5 180, 318.5 346.4, 72 346.4" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
        <circle cx="565" cy="180" r="3.5" fill="#0F172A"/>
        <circle cx="72" cy="346.4" r="3.5" fill="#0F172A"/>
    
        <rect x="290.5" y="247.2" width="56" height="15" rx="3" fill="#FFFFFF" stroke="#0F172A" stroke-width="1" opacity="0.9"/>
        <text x="318.5" y="258.2" fill="#0F172A" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">GND</text>
        </g>
    <g>
        <path d="M 72 173.6 C 254.0 173.6, 254.0 300, 436 300" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
        <circle cx="72" cy="173.6" r="3.5" fill="#3B82F6"/>
        <circle cx="436" cy="300" r="3.5" fill="#3B82F6"/>
    
        <rect x="226.0" y="220.8" width="56" height="15" rx="3" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1" opacity="0.9"/>
        <text x="254.0" y="231.8" fill="#3B82F6" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">PA0 Input</text>
        </g>
    <g transform="translate(60, 415)">
        <rect width="680" height="50" rx="6" fill="#0F172A"/>
        <text x="20" y="30" fill="#22C55E" font-family="monospace" font-size="12" font-weight="bold">USART2_TX (PA2):</text>
        <text x="170" y="30" fill="#F8FAFC" font-family="monospace" font-size="12">"Reaction Time: 238 ms" &bull; Hardware Timer Microsecond Resolution</text>
    </g>
    </svg>
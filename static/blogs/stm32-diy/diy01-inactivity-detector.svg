<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.12" />
        </filter>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#CBD5E1" opacity="0.6"/>
        </pattern>
        <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284C7"/>
            <stop offset="100%" stop-color="#0369A1"/>
        </linearGradient>
        <linearGradient id="breadboardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#F8FAFC"/>
            <stop offset="100%" stop-color="#F1F5F9"/>
        </linearGradient>
    </defs>
    <!-- Background Canvas -->
    <rect width="800" height="480" fill="#F8FAFC" />
    <rect width="800" height="480" fill="url(#grid)" />
    <!-- Header Banner -->
    <rect x="0" y="0" width="800" height="42" fill="#0F172A" />
    <text x="24" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">STM32 EMBEDDED WIRING SCHEMATIC &bull; ASSIGNMENT 1: INACTIVITY DETECTOR (STM32 PA5 & PC13)</text>
    <rect x="0" y="42" width="800" height="3" fill="#FF5B5B" />

    <!-- Pin Header Block: STM32F446RE PINS -->
    <g transform="translate(60,80)" filter="url(#shadow)">
        <rect width="230" height="320" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
        <rect x="0" y="0" width="230" height="24" rx="6" fill="#0F172A"/>
        <text x="115.0" y="16" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">STM32F446RE PINS</text>
    
        <circle cx="12" cy="36.0" r="5" fill="#F59E0B" stroke="#78350F" stroke-width="1"/>
        <circle cx="12" cy="36.0" r="2" fill="#0F172A"/>
        <text x="24" y="40.0" fill="#F1F5F9" font-family="monospace" font-size="10" font-weight="600" text-anchor="start">PA5  (GPIO Output &bull; LD2)</text>
        
        <circle cx="12" cy="108.0" r="5" fill="#F59E0B" stroke="#78350F" stroke-width="1"/>
        <circle cx="12" cy="108.0" r="2" fill="#0F172A"/>
        <text x="24" y="112.0" fill="#F1F5F9" font-family="monospace" font-size="10" font-weight="600" text-anchor="start">PC13 (GPIO Input  &bull; B1)</text>
        
        <circle cx="12" cy="180.0" r="5" fill="#F59E0B" stroke="#78350F" stroke-width="1"/>
        <circle cx="12" cy="180.0" r="2" fill="#0F172A"/>
        <text x="24" y="184.0" fill="#F1F5F9" font-family="monospace" font-size="10" font-weight="600" text-anchor="start">3.3V (VDD Supply)</text>
        
        <circle cx="12" cy="252.0" r="5" fill="#F59E0B" stroke="#78350F" stroke-width="1"/>
        <circle cx="12" cy="252.0" r="2" fill="#0F172A"/>
        <text x="24" y="256.0" fill="#F1F5F9" font-family="monospace" font-size="10" font-weight="600" text-anchor="start">GND  (Common Ground)</text>
        </g>
    <!-- Breadboard Area -->
    <g transform="translate(340,80)" filter="url(#shadow)">
        <rect width="400" height="320" rx="8" fill="url(#breadboardGrad)" stroke="#CBD5E1" stroke-width="2"/>
        <line x1="15" y1="12" x2="385" y2="12" stroke="#EF4444" stroke-width="2" stroke-dasharray="8,4"/>
        <line x1="15" y1="20" x2="385" y2="20" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8,4"/>
        <text x="6" y="15" fill="#EF4444" font-family="monospace" font-size="11" font-weight="bold">+</text>
        <text x="6" y="23" fill="#3B82F6" font-family="monospace" font-size="11" font-weight="bold">-</text>
        
        <line x1="15" y1="300" x2="385" y2="300" stroke="#EF4444" stroke-width="2" stroke-dasharray="8,4"/>
        <line x1="15" y1="308" x2="385" y2="308" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8,4"/>
        <text x="6" y="303" fill="#EF4444" font-family="monospace" font-size="11" font-weight="bold">+</text>
        <text x="6" y="311" fill="#3B82F6" font-family="monospace" font-size="11" font-weight="bold">-</text>
        <rect x="15" y="156.0" width="370" height="8" fill="#E2E8F0" rx="2"/>
    </g>
    
    <g transform="translate(460,180)">
        <circle cx="0" cy="0" r="12" fill="#22C55E" opacity="0.85" stroke="#0F172A" stroke-width="1.5"/>
        <circle cx="-3" cy="-3" r="4" fill="#FFFFFF" opacity="0.6"/>
        <line x1="11" y1="-7" x2="11" y2="7" stroke="#0F172A" stroke-width="2"/>
        <line x1="-6" y1="12" x2="-6" y2="28" stroke="#94A3B8" stroke-width="2.5"/>
        <line x1="6" y1="12" x2="6" y2="28" stroke="#94A3B8" stroke-width="2.5"/>
        <text x="-6" y="40" fill="#0F172A" font-family="monospace" font-size="8" text-anchor="middle">(+)Anode</text>
        <text x="14" y="40" fill="#0F172A" font-family="monospace" font-size="8" text-anchor="middle">(-)Cathode</text>
        <text x="0" y="-16" fill="#0F172A" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">LED on PA5</text>
    </g>
    
        <g transform="translate(540,180)">
            <line x1="-25" y1="0" x2="25" y2="0" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
            <rect x="-14" y="-6" width="28" height="12" rx="3" fill="#FDE68A" stroke="#D97706" stroke-width="1.2"/>
            <rect x="-8" y="-6" width="3" height="12" fill="#B45309"/>
            <rect x="-2" y="-6" width="3" height="12" fill="#B45309"/>
            <rect x="4" y="-6" width="3" height="12" fill="#78350F"/>
            <text x="0" y="-10" fill="#0F172A" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">330 &Omega;</text>
        </g>
        
    <g transform="translate(460,290)">
        <rect x="-18" y="-18" width="36" height="36" rx="4" fill="#334155" stroke="#0F172A" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="10" fill="#0284C7" stroke="#0369A1" stroke-width="1.5"/>
        <rect x="-24" y="-12" width="6" height="4" fill="#94A3B8"/>
        <rect x="-24" y="8" width="6" height="4" fill="#94A3B8"/>
        <rect x="18" y="-12" width="6" height="4" fill="#94A3B8"/>
        <rect x="18" y="8" width="6" height="4" fill="#94A3B8"/>
        <text x="-26" y="-7" fill="#64748B" font-family="monospace" font-size="8" text-anchor="end">Pin 1</text>
        <text x="26" y="-7" fill="#64748B" font-family="monospace" font-size="8">Pin 2</text>
        <text x="0" y="-22" fill="#0F172A" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Button on PC13</text>
    </g>
    
    <g>
        <path d="M 72 116.0 C 263.0 116.0, 263.0 180, 454 180" fill="none" stroke="#22C55E" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
        <circle cx="72" cy="116.0" r="3.5" fill="#22C55E"/>
        <circle cx="454" cy="180" r="3.5" fill="#22C55E"/>
    
        <rect x="235.0" y="132.0" width="56" height="15" rx="3" fill="#FFFFFF" stroke="#22C55E" stroke-width="1" opacity="0.9"/>
        <text x="263.0" y="143.0" fill="#22C55E" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">PA5 Control</text>
        </g>
    <g>
        <path d="M 466 180 C 490.5 180, 490.5 180, 515 180" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
        <circle cx="466" cy="180" r="3.5" fill="#94A3B8"/>
        <circle cx="515" cy="180" r="3.5" fill="#94A3B8"/>
    </g>
    <g>
        <path d="M 565 180 C 622.5 180, 622.5 180, 680 180" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
        <circle cx="565" cy="180" r="3.5" fill="#0F172A"/>
        <circle cx="680" cy="180" r="3.5" fill="#0F172A"/>
    
        <rect x="594.5" y="164.0" width="56" height="15" rx="3" fill="#FFFFFF" stroke="#0F172A" stroke-width="1" opacity="0.9"/>
        <text x="622.5" y="175.0" fill="#0F172A" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">GND</text>
        </g>
    <g>
        <path d="M 680 180 C 680.0 180, 680.0 380, 680 380" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
        <circle cx="680" cy="180" r="3.5" fill="#0F172A"/>
        <circle cx="680" cy="380" r="3.5" fill="#0F172A"/>
    </g>
    <g>
        <path d="M 680 380 C 376.0 380, 376.0 332.0, 72 332.0" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
        <circle cx="680" cy="380" r="3.5" fill="#0F172A"/>
        <circle cx="72" cy="332.0" r="3.5" fill="#0F172A"/>
    
        <rect x="348.0" y="340.0" width="56" height="15" rx="3" fill="#FFFFFF" stroke="#0F172A" stroke-width="1" opacity="0.9"/>
        <text x="376.0" y="351.0" fill="#0F172A" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">GND</text>
        </g>
    <g>
        <path d="M 72 188.0 C 254.0 188.0, 254.0 290, 436 290" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
        <circle cx="72" cy="188.0" r="3.5" fill="#3B82F6"/>
        <circle cx="436" cy="290" r="3.5" fill="#3B82F6"/>
    
        <rect x="226.0" y="223.0" width="56" height="15" rx="3" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1" opacity="0.9"/>
        <text x="254.0" y="234.0" fill="#3B82F6" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">PC13 Input</text>
        </g>
    <g>
        <path d="M 484 290 C 582.0 290, 582.0 290, 680 290" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
        <circle cx="484" cy="290" r="3.5" fill="#0F172A"/>
        <circle cx="680" cy="290" r="3.5" fill="#0F172A"/>
    </g>
    <g transform="translate(600,370)" filter="url(#shadow)">
        <rect width="180" height="96" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text x="12" y="18" fill="#0F172A" font-family="sans-serif" font-size="10" font-weight="bold">WIRE COLOR CODING</text>
        <line x1="12" y1="32" x2="36" y2="32" stroke="#EF4444" stroke-width="3"/>
        <text x="44" y="35" fill="#334155" font-family="monospace" font-size="9">3.3V / VDD Rail</text>
        <line x1="12" y1="50" x2="36" y2="50" stroke="#0F172A" stroke-width="3"/>
        <text x="44" y="53" fill="#334155" font-family="monospace" font-size="9">GND (0.0V Rail)</text>
        <line x1="12" y1="68" x2="36" y2="68" stroke="#3B82F6" stroke-width="3"/>
        <text x="44" y="71" fill="#334155" font-family="monospace" font-size="9">STM32 GPIO Signal</text>
        <line x1="12" y1="84" x2="36" y2="84" stroke="#F59E0B" stroke-width="3"/>
        <text x="44" y="87" fill="#334155" font-family="monospace" font-size="9">Analog / ADC Input</text>
    </g>
    </svg>
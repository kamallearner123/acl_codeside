<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.12" />
        </filter>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#CBD5E1" opacity="0.6"/>
        </pattern>
        <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284C7"/>
            <stop offset="100%" stop-color="#0369A1"/>
        </linearGradient>
        <linearGradient id="breadboardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#F8FAFC"/>
            <stop offset="100%" stop-color="#F1F5F9"/>
        </linearGradient>
    </defs>
    <!-- Background Canvas -->
    <rect width="800" height="480" fill="#F8FAFC" />
    <rect width="800" height="480" fill="url(#grid)" />
    <!-- Header Banner -->
    <rect x="0" y="0" width="800" height="42" fill="#0F172A" />
    <text x="24" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">STM32 EMBEDDED WIRING SCHEMATIC &bull; ASSIGNMENT 1: INACTIVITY DETECTOR (STM32 PA5 & PC13)</text>
    <rect x="0" y="42" width="800" height="3" fill="#FF5B5B" />

    <!-- STM32 Pin Header Block: STM32F446RE PINS -->
    <g transform="translate(45,80)" filter="url(#shadow)">
        <rect width="260" height="320" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
        <rect x="0" y="0" width="260" height="32" rx="8" fill="#1E293B"/>
        <rect x="0" y="24" width="260" height="8" fill="#1E293B"/>
        <text x="130.0" y="21" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">STM32F446RE PINS</text>
    
        <!-- Pin: PA5 -->
        <rect x="8" y="36.0" width="230" height="24" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
        <text x="16" y="52.0" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">PA5</text>
        <text x="64" y="51.5" fill="#CBD5E1" font-family="sans-serif" font-size="9">(GPIO Output &bull; LD2)</text>
        <!-- Contact pad on far right edge -->
        <circle cx="244" cy="48.0" r="6" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="244" cy="48.0" r="2" fill="#0F172A"/>
        
        <!-- Pin: PC13 -->
        <rect x="8" y="105.0" width="230" height="24" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
        <text x="16" y="121.0" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">PC13</text>
        <text x="64" y="120.5" fill="#CBD5E1" font-family="sans-serif" font-size="9">(GPIO Input  &bull; B1)</text>
        <!-- Contact pad on far right edge -->
        <circle cx="244" cy="117.0" r="6" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="244" cy="117.0" r="2" fill="#0F172A"/>
        
        <!-- Pin: 3.3V -->
        <rect x="8" y="174.0" width="230" height="24" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
        <text x="16" y="190.0" fill="#EF4444" font-family="monospace" font-size="11" font-weight="bold">3.3V</text>
        <text x="64" y="189.5" fill="#CBD5E1" font-family="sans-serif" font-size="9">(VDD Supply)</text>
        <!-- Contact pad on far right edge -->
        <circle cx="244" cy="186.0" r="6" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="244" cy="186.0" r="2" fill="#0F172A"/>
        
        <!-- Pin: GND -->
        <rect x="8" y="243.0" width="230" height="24" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
        <text x="16" y="259.0" fill="#94A3B8" font-family="monospace" font-size="11" font-weight="bold">GND</text>
        <text x="64" y="258.5" fill="#CBD5E1" font-family="sans-serif" font-size="9">(Common Ground)</text>
        <!-- Contact pad on far right edge -->
        <circle cx="244" cy="255.0" r="6" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="244" cy="255.0" r="2" fill="#0F172A"/>
        </g>
    <!-- Breadboard Area -->
    <g transform="translate(345,80)" filter="url(#shadow)">
        <rect width="400" height="320" rx="8" fill="url(#breadboardGrad)" stroke="#CBD5E1" stroke-width="2"/>
        <!-- Top Power Rails -->
        <line x1="20" y1="14" x2="380" y2="14" stroke="#EF4444" stroke-width="2" stroke-dasharray="8,4"/>
        <line x1="20" y1="24" x2="380" y2="24" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8,4"/>
        <text x="8" y="17" fill="#EF4444" font-family="monospace" font-size="11" font-weight="bold">+</text>
        <text x="8" y="27" fill="#3B82F6" font-family="monospace" font-size="11" font-weight="bold">-</text>
        
        <!-- Bottom Power Rails -->
        <line x1="20" y1="296" x2="380" y2="296" stroke="#EF4444" stroke-width="2" stroke-dasharray="8,4"/>
        <line x1="20" y1="306" x2="380" y2="306" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8,4"/>
        <text x="8" y="299" fill="#EF4444" font-family="monospace" font-size="11" font-weight="bold">+</text>
        <text x="8" y="309" fill="#3B82F6" font-family="monospace" font-size="11" font-weight="bold">-</text>
        
        <!-- Center Divider -->
        <rect x="15" y="156.0" width="370" height="8" fill="#E2E8F0" rx="2"/>
    </g>
    
    <g transform="translate(480,160)">
        <circle cx="0" cy="0" r="14" fill="#22C55E" opacity="0.9" stroke="#0F172A" stroke-width="1.5"/>
        <circle cx="-4" cy="-4" r="4" fill="#FFFFFF" opacity="0.7"/>
        <line x1="-10" y1="16" x2="-10" y2="32" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="10" y1="16" x2="10" y2="32" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="-10" cy="32" r="3.5" fill="#EF4444" stroke="#FFFFFF" stroke-width="1"/>
        <circle cx="10" cy="32" r="3.5" fill="#0F172A" stroke="#FFFFFF" stroke-width="1"/>
        <text x="-10" y="44" fill="#EF4444" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">(+)Anode</text>
        <text x="10" y="44" fill="#0F172A" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">(-)Cathode</text>
        <text x="0" y="-18" fill="#0F172A" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">LED on PA5</text>
    </g>
    
        <g transform="translate(570,160)">
            <line x1="-30" y1="0" x2="30" y2="0" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
            <rect x="-15" y="-7" width="30" height="14" rx="3" fill="#FDE68A" stroke="#D97706" stroke-width="1.2"/>
            <rect x="-9" y="-7" width="3" height="14" fill="#B45309"/>
            <rect x="-3" y="-7" width="3" height="14" fill="#B45309"/>
            <rect x="3" y="-7" width="3" height="14" fill="#78350F"/>
            <circle cx="-30" cy="0" r="3.5" fill="#64748B" stroke="#FFFFFF" stroke-width="1"/>
            <circle cx="30" cy="0" r="3.5" fill="#64748B" stroke="#FFFFFF" stroke-width="1"/>
            <text x="0" y="-11" fill="#0F172A" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">330 &Omega;</text>
        </g>
        
    <g transform="translate(480,280)">
        <rect x="-18" y="-18" width="36" height="36" rx="4" fill="#1E293B" stroke="#0F172A" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="10" fill="#0284C7" stroke="#0369A1" stroke-width="1.5"/>
        <!-- Terminal 1 Left -->
        <rect x="-26" y="-3" width="8" height="6" fill="#94A3B8"/>
        <circle cx="-26" cy="0" r="3.5" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1"/>
        <text x="-32" y="3.5" fill="#64748B" font-family="monospace" font-size="8" font-weight="bold" text-anchor="end">Pin 1</text>
        <!-- Terminal 2 Right -->
        <rect x="18" y="-3" width="8" height="6" fill="#94A3B8"/>
        <circle cx="26" cy="0" r="3.5" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1"/>
        <text x="32" y="3.5" fill="#64748B" font-family="monospace" font-size="8" font-weight="bold" text-anchor="start">Pin 2</text>
        <text x="0" y="-23" fill="#0F172A" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Button on PC13</text>
    </g>
    
    <g>
        <path d="M 289 128.0 C 370.45 128.0, 388.55 192, 470 192" fill="none" stroke="#22C55E" stroke-width="2.8" stroke-linecap="round" opacity="0.95"/>
        <circle cx="289" cy="128.0" r="4" fill="#22C55E" stroke="#FFFFFF" stroke-width="1.2"/>
        <circle cx="470" cy="192" r="4" fill="#22C55E" stroke="#FFFFFF" stroke-width="1.2"/>
    
        <g transform="translate(379.5,152.0)">
            <rect x="-32" y="-9" width="64" height="18" rx="4" fill="#FFFFFF" stroke="#22C55E" stroke-width="1.2" opacity="0.95"/>
            <text x="0" y="3.5" fill="#22C55E" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">PA5 Control</text>
        </g>
        </g>
    <g>
        <path d="M 490 192 C 515 192, 515 160, 540 160" fill="none" stroke="#94A3B8" stroke-width="2.8" stroke-linecap="round" opacity="0.95"/>
        <circle cx="490" cy="192" r="4" fill="#94A3B8" stroke="#FFFFFF" stroke-width="1.2"/>
        <circle cx="540" cy="160" r="4" fill="#94A3B8" stroke="#FFFFFF" stroke-width="1.2"/>
    </g>
    <g>
        <path d="M 600 160 C 636.0 160, 644.0 160, 680 160" fill="none" stroke="#0F172A" stroke-width="2.8" stroke-linecap="round" opacity="0.95"/>
        <circle cx="600" cy="160" r="4" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.2"/>
        <circle cx="680" cy="160" r="4" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.2"/>
    </g>
    <g>
        <path d="M 680 160 C 705 160, 655 376, 680 376" fill="none" stroke="#0F172A" stroke-width="2.8" stroke-linecap="round" opacity="0.95"/>
        <circle cx="680" cy="160" r="4" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.2"/>
        <circle cx="680" cy="376" r="4" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.2"/>
    </g>
    <g>
        <path d="M 680 376 C 855.95 376, 113.04999999999998 335.0, 289 335.0" fill="none" stroke="#0F172A" stroke-width="2.8" stroke-linecap="round" opacity="0.95"/>
        <circle cx="680" cy="376" r="4" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.2"/>
        <circle cx="289" cy="335.0" r="4" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.2"/>
    
        <g transform="translate(484.5,347.5)">
            <rect x="-32" y="-9" width="64" height="18" rx="4" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2" opacity="0.95"/>
            <text x="0" y="3.5" fill="#0F172A" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">GND Rail</text>
        </g>
        </g>
    <g>
        <path d="M 289 197.0 C 363.25 197.0, 379.75 280, 454 280" fill="none" stroke="#3B82F6" stroke-width="2.8" stroke-linecap="round" opacity="0.95"/>
        <circle cx="289" cy="197.0" r="4" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.2"/>
        <circle cx="454" cy="280" r="4" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.2"/>
    
        <g transform="translate(371.5,230.5)">
            <rect x="-32" y="-9" width="64" height="18" rx="4" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.2" opacity="0.95"/>
            <text x="0" y="3.5" fill="#3B82F6" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">PC13 Input</text>
        </g>
        </g>
    <g>
        <path d="M 506 280 C 584.3 280, 601.7 280, 680 280" fill="none" stroke="#0F172A" stroke-width="2.8" stroke-linecap="round" opacity="0.95"/>
        <circle cx="506" cy="280" r="4" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.2"/>
        <circle cx="680" cy="280" r="4" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.2"/>
    </g>
    <g transform="translate(550,270)" filter="url(#shadow)">
        <rect width="180" height="96" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text x="12" y="18" fill="#0F172A" font-family="sans-serif" font-size="10" font-weight="bold">WIRE COLOR CODING</text>
        <line x1="12" y1="32" x2="36" y2="32" stroke="#EF4444" stroke-width="3"/>
        <text x="44" y="35" fill="#334155" font-family="monospace" font-size="9">3.3V / VDD Rail</text>
        <line x1="12" y1="50" x2="36" y2="50" stroke="#0F172A" stroke-width="3"/>
        <text x="44" y="53" fill="#334155" font-family="monospace" font-size="9">GND (0.0V Rail)</text>
        <line x1="12" y1="68" x2="36" y2="68" stroke="#3B82F6" stroke-width="3"/>
        <text x="44" y="71" fill="#334155" font-family="monospace" font-size="9">STM32 GPIO Signal</text>
        <line x1="12" y1="84" x2="36" y2="84" stroke="#F59E0B" stroke-width="3"/>
        <text x="44" y="87" fill="#334155" font-family="monospace" font-size="9">Analog / ADC Input</text>
    </g>
    </svg>
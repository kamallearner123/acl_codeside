<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.12" />
        </filter>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#CBD5E1" opacity="0.6"/>
        </pattern>
        <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284C7"/>
            <stop offset="100%" stop-color="#0369A1"/>
        </linearGradient>
        <linearGradient id="breadboardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#F8FAFC"/>
            <stop offset="100%" stop-color="#F1F5F9"/>
        </linearGradient>
    </defs>
    <!-- Background Canvas -->
    <rect width="800" height="480" fill="#F8FAFC" />
    <rect width="800" height="480" fill="url(#grid)" />
    <!-- Header Banner -->
    <rect x="0" y="0" width="800" height="42" fill="#0F172A" />
    <text x="24" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">STM32 EMBEDDED WIRING SCHEMATIC &bull; ASSIGNMENT 8: NON-BLOCKING TRAFFIC JUNCTION (PB0..PB5 & PA0)</text>
    <rect x="0" y="42" width="800" height="3" fill="#FF5B5B" />

    <!-- Pin Header Block: STM32 GPIO PINS -->
    <g transform="translate(60,80)" filter="url(#shadow)">
        <rect width="230" height="320" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
        <rect x="0" y="0" width="230" height="24" rx="6" fill="#0F172A"/>
        <text x="115.0" y="16" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">STM32 GPIO PINS</text>
    
        <circle cx="12" cy="36.0" r="5" fill="#F59E0B" stroke="#78350F" stroke-width="1"/>
        <circle cx="12" cy="36.0" r="2" fill="#0F172A"/>
        <text x="24" y="40.0" fill="#F1F5F9" font-family="monospace" font-size="10" font-weight="600" text-anchor="start">PB0  (Vehicle RED LED)</text>
        
        <circle cx="12" cy="84.0" r="5" fill="#F59E0B" stroke="#78350F" stroke-width="1"/>
        <circle cx="12" cy="84.0" r="2" fill="#0F172A"/>
        <text x="24" y="88.0" fill="#F1F5F9" font-family="monospace" font-size="10" font-weight="600" text-anchor="start">PB1  (Vehicle YELLOW LED)</text>
        
        <circle cx="12" cy="132.0" r="5" fill="#F59E0B" stroke="#78350F" stroke-width="1"/>
        <circle cx="12" cy="132.0" r="2" fill="#0F172A"/>
        <text x="24" y="136.0" fill="#F1F5F9" font-family="monospace" font-size="10" font-weight="600" text-anchor="start">PB2  (Vehicle GREEN LED)</text>
        
        <circle cx="12" cy="180.0" r="5" fill="#F59E0B" stroke="#78350F" stroke-width="1"/>
        <circle cx="12" cy="180.0" r="2" fill="#0F172A"/>
        <text x="24" y="184.0" fill="#F1F5F9" font-family="monospace" font-size="10" font-weight="600" text-anchor="start">PB4  (Pedestrian RED)</text>
        
        <circle cx="12" cy="228.0" r="5" fill="#F59E0B" stroke="#78350F" stroke-width="1"/>
        <circle cx="12" cy="228.0" r="2" fill="#0F172A"/>
        <text x="24" y="232.0" fill="#F1F5F9" font-family="monospace" font-size="10" font-weight="600" text-anchor="start">PB5  (Pedestrian GREEN)</text>
        
        <circle cx="12" cy="276.0" r="5" fill="#F59E0B" stroke="#78350F" stroke-width="1"/>
        <circle cx="12" cy="276.0" r="2" fill="#0F172A"/>
        <text x="24" y="280.0" fill="#F1F5F9" font-family="monospace" font-size="10" font-weight="600" text-anchor="start">PA0  (Pedestrian Request)</text>
        </g>
    <!-- Breadboard Area -->
    <g transform="translate(340,80)" filter="url(#shadow)">
        <rect width="400" height="320" rx="8" fill="url(#breadboardGrad)" stroke="#CBD5E1" stroke-width="2"/>
        <line x1="15" y1="12" x2="385" y2="12" stroke="#EF4444" stroke-width="2" stroke-dasharray="8,4"/>
        <line x1="15" y1="20" x2="385" y2="20" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8,4"/>
        <text x="6" y="15" fill="#EF4444" font-family="monospace" font-size="11" font-weight="bold">+</text>
        <text x="6" y="23" fill="#3B82F6" font-family="monospace" font-size="11" font-weight="bold">-</text>
        
        <line x1="15" y1="300" x2="385" y2="300" stroke="#EF4444" stroke-width="2" stroke-dasharray="8,4"/>
        <line x1="15" y1="308" x2="385" y2="308" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8,4"/>
        <text x="6" y="303" fill="#EF4444" font-family="monospace" font-size="11" font-weight="bold">+</text>
        <text x="6" y="311" fill="#3B82F6" font-family="monospace" font-size="11" font-weight="bold">-</text>
        <rect x="15" y="156.0" width="370" height="8" fill="#E2E8F0" rx="2"/>
    </g>
    
    <g transform="translate(420, 100)">
        <rect width="90" height="200" rx="10" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
        <text x="45" y="22" fill="#E2E8F0" font-family="monospace" font-size="9" text-anchor="middle">VEHICLE</text>
        <circle cx="45" cy="55" r="16" fill="#EF4444" stroke="#991B1B" stroke-width="2"/>
        <text x="45" y="78" fill="#FFFFFF" font-family="monospace" font-size="7" text-anchor="middle">PB0</text>
        <circle cx="45" cy="105" r="16" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
        <text x="45" y="128" fill="#FFFFFF" font-family="monospace" font-size="7" text-anchor="middle">PB1</text>
        <circle cx="45" cy="155" r="16" fill="#22C55E" stroke="#15803D" stroke-width="2"/>
        <text x="45" y="178" fill="#FFFFFF" font-family="monospace" font-size="7" text-anchor="middle">PB2</text>
    </g>
    <g transform="translate(560, 100)">
        <rect width="80" height="140" rx="10" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
        <text x="40" y="22" fill="#E2E8F0" font-family="monospace" font-size="9" text-anchor="middle">PEDESTRIAN</text>
        <circle cx="40" cy="55" r="16" fill="#EF4444"/>
        <text x="40" y="78" fill="#FFFFFF" font-family="monospace" font-size="7" text-anchor="middle">PB4</text>
        <circle cx="40" cy="105" r="16" fill="#22C55E"/>
        <text x="40" y="128" fill="#FFFFFF" font-family="monospace" font-size="7" text-anchor="middle">PB5</text>
    </g>
    
    <g transform="translate(600,300)">
        <rect x="-18" y="-18" width="36" height="36" rx="4" fill="#334155" stroke="#0F172A" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="10" fill="#0284C7" stroke="#0369A1" stroke-width="1.5"/>
        <rect x="-24" y="-12" width="6" height="4" fill="#94A3B8"/>
        <rect x="-24" y="8" width="6" height="4" fill="#94A3B8"/>
        <rect x="18" y="-12" width="6" height="4" fill="#94A3B8"/>
        <rect x="18" y="8" width="6" height="4" fill="#94A3B8"/>
        <text x="-26" y="-7" fill="#64748B" font-family="monospace" font-size="8" text-anchor="end">Pin 1</text>
        <text x="26" y="-7" fill="#64748B" font-family="monospace" font-size="8">Pin 2</text>
        <text x="0" y="-22" fill="#0F172A" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Walk Request (PA0)</text>
    </g>
    
    <g>
        <path d="M 72 116.0 C 246.0 116.0, 246.0 155, 420 155" fill="none" stroke="#EF4444" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
        <circle cx="72" cy="116.0" r="3.5" fill="#EF4444"/>
        <circle cx="420" cy="155" r="3.5" fill="#EF4444"/>
    
        <rect x="218.0" y="119.5" width="56" height="15" rx="3" fill="#FFFFFF" stroke="#EF4444" stroke-width="1" opacity="0.9"/>
        <text x="246.0" y="130.5" fill="#EF4444" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">PB0</text>
        </g>
    <g>
        <path d="M 72 164.0 C 246.0 164.0, 246.0 205, 420 205" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
        <circle cx="72" cy="164.0" r="3.5" fill="#F59E0B"/>
        <circle cx="420" cy="205" r="3.5" fill="#F59E0B"/>
    
        <rect x="218.0" y="168.5" width="56" height="15" rx="3" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1" opacity="0.9"/>
        <text x="246.0" y="179.5" fill="#F59E0B" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">PB1</text>
        </g>
    <g>
        <path d="M 72 212.0 C 246.0 212.0, 246.0 255, 420 255" fill="none" stroke="#22C55E" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
        <circle cx="72" cy="212.0" r="3.5" fill="#22C55E"/>
        <circle cx="420" cy="255" r="3.5" fill="#22C55E"/>
    
        <rect x="218.0" y="217.5" width="56" height="15" rx="3" fill="#FFFFFF" stroke="#22C55E" stroke-width="1" opacity="0.9"/>
        <text x="246.0" y="228.5" fill="#22C55E" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">PB2</text>
        </g>
    <g>
        <path d="M 72 356.0 C 324.0 356.0, 324.0 300, 576 300" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
        <circle cx="72" cy="356.0" r="3.5" fill="#38BDF8"/>
        <circle cx="576" cy="300" r="3.5" fill="#38BDF8"/>
    
        <rect x="296.0" y="312.0" width="56" height="15" rx="3" fill="#FFFFFF" stroke="#38BDF8" stroke-width="1" opacity="0.9"/>
        <text x="324.0" y="323.0" fill="#38BDF8" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">PA0</text>
        </g></svg>
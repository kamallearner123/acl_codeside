<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.12" />
        </filter>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#CBD5E1" opacity="0.6"/>
        </pattern>
        <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284C7"/>
            <stop offset="100%" stop-color="#0369A1"/>
        </linearGradient>
        <linearGradient id="breadboardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#F8FAFC"/>
            <stop offset="100%" stop-color="#F1F5F9"/>
        </linearGradient>
    </defs>
    <!-- Background Canvas -->
    <rect width="800" height="480" fill="#F8FAFC" />
    <rect width="800" height="480" fill="url(#grid)" />
    <!-- Header Banner -->
    <rect x="0" y="0" width="800" height="42" fill="#0F172A" />
    <text x="24" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">STM32 EMBEDDED WIRING SCHEMATIC &bull; ASSIGNMENT 8: NON-BLOCKING TRAFFIC JUNCTION (PB0..PB5 & PA0)</text>
    <rect x="0" y="42" width="800" height="3" fill="#FF5B5B" />

    <!-- STM32 Pin Header Block: STM32 GPIO PINS -->
    <g transform="translate(45,80)" filter="url(#shadow)">
        <rect width="260" height="320" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
        <rect x="0" y="0" width="260" height="32" rx="8" fill="#1E293B"/>
        <rect x="0" y="24" width="260" height="8" fill="#1E293B"/>
        <text x="130.0" y="21" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">STM32 GPIO PINS</text>
    
        <!-- Pin: PB0 -->
        <rect x="8" y="36.0" width="230" height="24" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
        <text x="16" y="52.0" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">PB0</text>
        <text x="64" y="51.5" fill="#CBD5E1" font-family="sans-serif" font-size="9">(Vehicle RED LED)</text>
        <!-- Contact pad on far right edge -->
        <circle cx="244" cy="48.0" r="6" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="244" cy="48.0" r="2" fill="#0F172A"/>
        
        <!-- Pin: PB1 -->
        <rect x="8" y="82.0" width="230" height="24" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
        <text x="16" y="98.0" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">PB1</text>
        <text x="64" y="97.5" fill="#CBD5E1" font-family="sans-serif" font-size="9">(Vehicle YELLOW LED)</text>
        <!-- Contact pad on far right edge -->
        <circle cx="244" cy="94.0" r="6" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="244" cy="94.0" r="2" fill="#0F172A"/>
        
        <!-- Pin: PB2 -->
        <rect x="8" y="128.0" width="230" height="24" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
        <text x="16" y="144.0" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">PB2</text>
        <text x="64" y="143.5" fill="#CBD5E1" font-family="sans-serif" font-size="9">(Vehicle GREEN LED)</text>
        <!-- Contact pad on far right edge -->
        <circle cx="244" cy="140.0" r="6" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="244" cy="140.0" r="2" fill="#0F172A"/>
        
        <!-- Pin: PB4 -->
        <rect x="8" y="174.0" width="230" height="24" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
        <text x="16" y="190.0" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">PB4</text>
        <text x="64" y="189.5" fill="#CBD5E1" font-family="sans-serif" font-size="9">(Pedestrian RED)</text>
        <!-- Contact pad on far right edge -->
        <circle cx="244" cy="186.0" r="6" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="244" cy="186.0" r="2" fill="#0F172A"/>
        
        <!-- Pin: PB5 -->
        <rect x="8" y="220.0" width="230" height="24" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
        <text x="16" y="236.0" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">PB5</text>
        <text x="64" y="235.5" fill="#CBD5E1" font-family="sans-serif" font-size="9">(Pedestrian GREEN)</text>
        <!-- Contact pad on far right edge -->
        <circle cx="244" cy="232.0" r="6" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="244" cy="232.0" r="2" fill="#0F172A"/>
        
        <!-- Pin: PA0 -->
        <rect x="8" y="266.0" width="230" height="24" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
        <text x="16" y="282.0" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">PA0</text>
        <text x="64" y="281.5" fill="#CBD5E1" font-family="sans-serif" font-size="9">(Pedestrian Request)</text>
        <!-- Contact pad on far right edge -->
        <circle cx="244" cy="278.0" r="6" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="244" cy="278.0" r="2" fill="#0F172A"/>
        </g>
    <!-- Breadboard Area -->
    <g transform="translate(345,80)" filter="url(#shadow)">
        <rect width="400" height="320" rx="8" fill="url(#breadboardGrad)" stroke="#CBD5E1" stroke-width="2"/>
        <!-- Top Power Rails -->
        <line x1="20" y1="14" x2="380" y2="14" stroke="#EF4444" stroke-width="2" stroke-dasharray="8,4"/>
        <line x1="20" y1="24" x2="380" y2="24" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8,4"/>
        <text x="8" y="17" fill="#EF4444" font-family="monospace" font-size="11" font-weight="bold">+</text>
        <text x="8" y="27" fill="#3B82F6" font-family="monospace" font-size="11" font-weight="bold">-</text>
        
        <!-- Bottom Power Rails -->
        <line x1="20" y1="296" x2="380" y2="296" stroke="#EF4444" stroke-width="2" stroke-dasharray="8,4"/>
        <line x1="20" y1="306" x2="380" y2="306" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8,4"/>
        <text x="8" y="299" fill="#EF4444" font-family="monospace" font-size="11" font-weight="bold">+</text>
        <text x="8" y="309" fill="#3B82F6" font-family="monospace" font-size="11" font-weight="bold">-</text>
        
        <!-- Center Divider -->
        <rect x="15" y="156.0" width="370" height="8" fill="#E2E8F0" rx="2"/>
    </g>
    
    <g transform="translate(420, 100)">
        <rect width="90" height="190" rx="10" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
        <text x="45" y="20" fill="#E2E8F0" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">VEHICLE</text>
        
        <!-- Red -->
        <circle cx="45" cy="50" r="16" fill="#EF4444" stroke="#991B1B" stroke-width="2"/>
        <circle cx="8" cy="50" r="3.5" fill="#EF4444" stroke="#FFFFFF" stroke-width="1"/>
        <text x="45" y="72" fill="#FFFFFF" font-family="monospace" font-size="8" text-anchor="middle">PB0</text>
        
        <!-- Yellow -->
        <circle cx="45" cy="100" r="16" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
        <circle cx="8" cy="100" r="3.5" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1"/>
        <text x="45" y="122" fill="#FFFFFF" font-family="monospace" font-size="8" text-anchor="middle">PB1</text>
        
        <!-- Green -->
        <circle cx="45" cy="150" r="16" fill="#22C55E" stroke="#15803D" stroke-width="2"/>
        <circle cx="8" cy="150" r="3.5" fill="#22C55E" stroke="#FFFFFF" stroke-width="1"/>
        <text x="45" y="172" fill="#FFFFFF" font-family="monospace" font-size="8" text-anchor="middle">PB2</text>
    </g>

    <!-- Housing for Pedestrian Traffic Lights -->
    <g transform="translate(560, 100)">
        <rect width="90" height="140" rx="10" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
        <text x="45" y="20" fill="#E2E8F0" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">PEDESTRIAN</text>
        
        <!-- Ped Red -->
        <circle cx="45" cy="50" r="16" fill="#EF4444"/>
        <circle cx="8" cy="50" r="3.5" fill="#EF4444" stroke="#FFFFFF" stroke-width="1"/>
        <text x="45" y="72" fill="#FFFFFF" font-family="monospace" font-size="8" text-anchor="middle">PB4</text>
        
        <!-- Ped Green -->
        <circle cx="45" cy="100" r="16" fill="#22C55E"/>
        <circle cx="8" cy="100" r="3.5" fill="#22C55E" stroke="#FFFFFF" stroke-width="1"/>
        <text x="45" y="122" fill="#FFFFFF" font-family="monospace" font-size="8" text-anchor="middle">PB5</text>
    </g>
    
    <g transform="translate(605,300)">
        <rect x="-18" y="-18" width="36" height="36" rx="4" fill="#1E293B" stroke="#0F172A" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="10" fill="#0284C7" stroke="#0369A1" stroke-width="1.5"/>
        <!-- Terminal 1 Left -->
        <rect x="-26" y="-3" width="8" height="6" fill="#94A3B8"/>
        <circle cx="-26" cy="0" r="3.5" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1"/>
        <text x="-32" y="3.5" fill="#64748B" font-family="monospace" font-size="8" font-weight="bold" text-anchor="end">Pin 1</text>
        <!-- Terminal 2 Right -->
        <rect x="18" y="-3" width="8" height="6" fill="#94A3B8"/>
        <circle cx="26" cy="0" r="3.5" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1"/>
        <text x="32" y="3.5" fill="#64748B" font-family="monospace" font-size="8" font-weight="bold" text-anchor="start">Pin 2</text>
        <text x="0" y="-23" fill="#0F172A" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Walk Request (PA0)</text>
    </g>
    
    <g>
        <path d="M 289 128.0 C 351.55 128.0, 365.45 150, 428 150" fill="none" stroke="#EF4444" stroke-width="2.8" stroke-linecap="round" opacity="0.95"/>
        <circle cx="289" cy="128.0" r="4" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.2"/>
        <circle cx="428" cy="150" r="4" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.2"/>
    
        <g transform="translate(358.5,131.0)">
            <rect x="-32" y="-9" width="64" height="18" rx="4" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.2" opacity="0.95"/>
            <text x="0" y="3.5" fill="#EF4444" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">PB0</text>
        </g>
        </g>
    <g>
        <path d="M 289 174.0 C 351.55 174.0, 365.45 200, 428 200" fill="none" stroke="#F59E0B" stroke-width="2.8" stroke-linecap="round" opacity="0.95"/>
        <circle cx="289" cy="174.0" r="4" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.2"/>
        <circle cx="428" cy="200" r="4" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.2"/>
    
        <g transform="translate(358.5,179.0)">
            <rect x="-32" y="-9" width="64" height="18" rx="4" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.2" opacity="0.95"/>
            <text x="0" y="3.5" fill="#F59E0B" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">PB1</text>
        </g>
        </g>
    <g>
        <path d="M 289 220.0 C 351.55 220.0, 365.45 250, 428 250" fill="none" stroke="#22C55E" stroke-width="2.8" stroke-linecap="round" opacity="0.95"/>
        <circle cx="289" cy="220.0" r="4" fill="#22C55E" stroke="#FFFFFF" stroke-width="1.2"/>
        <circle cx="428" cy="250" r="4" fill="#22C55E" stroke="#FFFFFF" stroke-width="1.2"/>
    
        <g transform="translate(358.5,227.0)">
            <rect x="-32" y="-9" width="64" height="18" rx="4" fill="#FFFFFF" stroke="#22C55E" stroke-width="1.2" opacity="0.95"/>
            <text x="0" y="3.5" fill="#22C55E" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">PB2</text>
        </g>
        </g>
    <g>
        <path d="M 289 266.0 C 414.55 266.0, 442.45 150, 568 150" fill="none" stroke="#EF4444" stroke-width="2.8" stroke-linecap="round" opacity="0.95"/>
        <circle cx="289" cy="266.0" r="4" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.2"/>
        <circle cx="568" cy="150" r="4" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.2"/>
    
        <g transform="translate(428.5,200.0)">
            <rect x="-32" y="-9" width="64" height="18" rx="4" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.2" opacity="0.95"/>
            <text x="0" y="3.5" fill="#EF4444" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">PB4</text>
        </g>
        </g>
    <g>
        <path d="M 289 312.0 C 414.55 312.0, 442.45 200, 568 200" fill="none" stroke="#22C55E" stroke-width="2.8" stroke-linecap="round" opacity="0.95"/>
        <circle cx="289" cy="312.0" r="4" fill="#22C55E" stroke="#FFFFFF" stroke-width="1.2"/>
        <circle cx="568" cy="200" r="4" fill="#22C55E" stroke="#FFFFFF" stroke-width="1.2"/>
    
        <g transform="translate(428.5,248.0)">
            <rect x="-32" y="-9" width="64" height="18" rx="4" fill="#FFFFFF" stroke="#22C55E" stroke-width="1.2" opacity="0.95"/>
            <text x="0" y="3.5" fill="#22C55E" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">PB5</text>
        </g>
        </g>
    <g>
        <path d="M 289 358.0 C 419.5 358.0, 448.5 300, 579 300" fill="none" stroke="#38BDF8" stroke-width="2.8" stroke-linecap="round" opacity="0.95"/>
        <circle cx="289" cy="358.0" r="4" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.2"/>
        <circle cx="579" cy="300" r="4" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.2"/>
    
        <g transform="translate(434.0,321.0)">
            <rect x="-32" y="-9" width="64" height="18" rx="4" fill="#FFFFFF" stroke="#38BDF8" stroke-width="1.2" opacity="0.95"/>
            <text x="0" y="3.5" fill="#38BDF8" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">PA0</text>
        </g>
        </g></svg>
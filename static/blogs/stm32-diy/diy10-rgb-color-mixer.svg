        <circle cx="244" cy="191.0" r="2" fill="#0F172A"/>
        
        <!-- Pin: PC13 -->
        <rect x="8" y="226.66666666666666" width="230" height="24" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
        <text x="16" y="242.66666666666666" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">PC13</text>
        <text x="64" y="242.16666666666666" fill="#CBD5E1" font-family="sans-serif" font-size="9">(GPIO_IN  &bull; Palette B1)</text>

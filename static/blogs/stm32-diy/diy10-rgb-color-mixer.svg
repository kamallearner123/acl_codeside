        <circle cx="475" cy="180" r="3.5" fill="#22C55E"/>
        <circle cx="565" cy="210" r="3.5" fill="#22C55E"/>
    </g>
    <g>
        <path d="M 72 212.0 C 248.5 212.0, 248.5 210, 425 210" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
        <circle cx="72" cy="212.0" r="3.5" fill="#3B82F6"/>

        <text x="16" y="195.0" fill="#F59E0B" font-family="monospace" font-size="11" font-weight="bold">PA0</text>
        <text x="64" y="194.5" fill="#CBD5E1" font-family="sans-serif" font-size="9">(ADC1_IN0 &bull; Dimmer Pot)</text>

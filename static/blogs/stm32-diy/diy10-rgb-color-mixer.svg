        <circle cx="244" cy="143.33333333333331" r="6" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="244" cy="143.33333333333331" r="2" fill="#0F172A"/>
        
        <!-- Pin: PA0 -->

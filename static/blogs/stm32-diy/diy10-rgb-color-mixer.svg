<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.12" />
        </filter>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#CBD5E1" opacity="0.6"/>
        </pattern>
        <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284C7"/>
            <stop offset="100%" stop-color="#0369A1"/>
        </linearGradient>
        <linearGradient id="breadboardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#F8FAFC"/>
            <stop offset="100%" stop-color="#F1F5F9"/>
        </linearGradient>
    </defs>
    <!-- Background Canvas -->
    <rect width="800" height="480" fill="#F8FAFC" />
    <rect width="800" height="480" fill="url(#grid)" />
    <!-- Header Banner -->
    <rect x="0" y="0" width="800" height="42" fill="#0F172A" />
    <text x="24" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">STM32 EMBEDDED WIRING SCHEMATIC &bull; ASSIGNMENT 10: RGB COLOR MIXER (PB4, PB5, PB0, PA0)</text>
    <rect x="0" y="42" width="800" height="3" fill="#FF5B5B" />

    <!-- Pin Header Block: STM32 TIMER & ADC -->
    <g transform="translate(60,80)" filter="url(#shadow)">
        <rect width="230" height="320" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
        <rect x="0" y="0" width="230" height="24" rx="6" fill="#0F172A"/>
        <text x="115.0" y="16" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">STM32 TIMER & ADC</text>
    
        <circle cx="12" cy="36.0" r="5" fill="#F59E0B" stroke="#78350F" stroke-width="1"/>
        <circle cx="12" cy="36.0" r="2" fill="#0F172A"/>
        <text x="24" y="40.0" fill="#F1F5F9" font-family="monospace" font-size="10" font-weight="600" text-anchor="start">PB4  (TIM3_CH1 &bull; Red PWM)</text>
        
        <circle cx="12" cy="84.0" r="5" fill="#F59E0B" stroke="#78350F" stroke-width="1"/>
        <circle cx="12" cy="84.0" r="2" fill="#0F172A"/>
        <text x="24" y="88.0" fill="#F1F5F9" font-family="monospace" font-size="10" font-weight="600" text-anchor="start">PB5  (TIM3_CH2 &bull; Green PWM)</text>
        
        <circle cx="12" cy="132.0" r="5" fill="#F59E0B" stroke="#78350F" stroke-width="1"/>
        <circle cx="12" cy="132.0" r="2" fill="#0F172A"/>
        <text x="24" y="136.0" fill="#F1F5F9" font-family="monospace" font-size="10" font-weight="600" text-anchor="start">PB0  (TIM3_CH3 &bull; Blue PWM)</text>
        
        <circle cx="12" cy="180.0" r="5" fill="#F59E0B" stroke="#78350F" stroke-width="1"/>
        <circle cx="12" cy="180.0" r="2" fill="#0F172A"/>
        <text x="24" y="184.0" fill="#F1F5F9" font-family="monospace" font-size="10" font-weight="600" text-anchor="start">PA0  (ADC1_IN0 &bull; Dimmer Pot)</text>
        
        <circle cx="12" cy="228.0" r="5" fill="#F59E0B" stroke="#78350F" stroke-width="1"/>
        <circle cx="12" cy="228.0" r="2" fill="#0F172A"/>
        <text x="24" y="232.0" fill="#F1F5F9" font-family="monospace" font-size="10" font-weight="600" text-anchor="start">PC13 (GPIO_IN  &bull; Palette B1)</text>
        
        <circle cx="12" cy="276.0" r="5" fill="#F59E0B" stroke="#78350F" stroke-width="1"/>
        <circle cx="12" cy="276.0" r="2" fill="#0F172A"/>
        <text x="24" y="280.0" fill="#F1F5F9" font-family="monospace" font-size="10" font-weight="600" text-anchor="start">GND  (Common Cathode Ground)</text>
        </g>
    <!-- Breadboard Area -->
    <g transform="translate(340,80)" filter="url(#shadow)">
        <rect width="400" height="320" rx="8" fill="url(#breadboardGrad)" stroke="#CBD5E1" stroke-width="2"/>
        <line x1="15" y1="12" x2="385" y2="12" stroke="#EF4444" stroke-width="2" stroke-dasharray="8,4"/>
        <line x1="15" y1="20" x2="385" y2="20" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8,4"/>
        <text x="6" y="15" fill="#EF4444" font-family="monospace" font-size="11" font-weight="bold">+</text>
        <text x="6" y="23" fill="#3B82F6" font-family="monospace" font-size="11" font-weight="bold">-</text>
        
        <line x1="15" y1="300" x2="385" y2="300" stroke="#EF4444" stroke-width="2" stroke-dasharray="8,4"/>
        <line x1="15" y1="308" x2="385" y2="308" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8,4"/>
        <text x="6" y="303" fill="#EF4444" font-family="monospace" font-size="11" font-weight="bold">+</text>
        <text x="6" y="311" fill="#3B82F6" font-family="monospace" font-size="11" font-weight="bold">-</text>
        <rect x="15" y="156.0" width="370" height="8" fill="#E2E8F0" rx="2"/>
    </g>
    
    <g transform="translate(560, 180)">
        <circle cx="0" cy="0" r="22" fill="#E2E8F0" stroke="#0F172A" stroke-width="2"/>
        <circle cx="-6" cy="-6" r="6" fill="#EF4444" opacity="0.8"/>
        <circle cx="6" cy="-6" r="6" fill="#22C55E" opacity="0.8"/>
        <circle cx="0" cy="6" r="6" fill="#3B82F6" opacity="0.8"/>
        <text x="0" y="-28" fill="#0F172A" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">RGB LED (CC)</text>
        <circle cx="-15" cy="30" r="3" fill="#EF4444"/><text x="-15" y="42" fill="#EF4444" font-family="monospace" font-size="8" text-anchor="middle">PB4(R)</text>
        <circle cx="-5" cy="30" r="3" fill="#0F172A"/><text x="-5" y="42" fill="#0F172A" font-family="monospace" font-size="8" text-anchor="middle">GND</text>
        <circle cx="5" cy="30" r="3" fill="#22C55E"/><text x="5" y="42" fill="#22C55E" font-family="monospace" font-size="8" text-anchor="middle">PB5(G)</text>
        <circle cx="15" cy="30" r="3" fill="#3B82F6"/><text x="15" y="42" fill="#3B82F6" font-family="monospace" font-size="8" text-anchor="middle">PB0(B)</text>
    </g>
    
        <g transform="translate(450,150)">
            <line x1="-25" y1="0" x2="25" y2="0" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
            <rect x="-14" y="-6" width="28" height="12" rx="3" fill="#FDE68A" stroke="#D97706" stroke-width="1.2"/>
            <rect x="-8" y="-6" width="3" height="12" fill="#B45309"/>
            <rect x="-2" y="-6" width="3" height="12" fill="#B45309"/>
            <rect x="4" y="-6" width="3" height="12" fill="#78350F"/>
            <text x="0" y="-10" fill="#0F172A" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">220&Omega; PB4</text>
        </g>
        
        <g transform="translate(450,180)">
            <line x1="-25" y1="0" x2="25" y2="0" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
            <rect x="-14" y="-6" width="28" height="12" rx="3" fill="#FDE68A" stroke="#D97706" stroke-width="1.2"/>
            <rect x="-8" y="-6" width="3" height="12" fill="#B45309"/>
            <rect x="-2" y="-6" width="3" height="12" fill="#B45309"/>
            <rect x="4" y="-6" width="3" height="12" fill="#78350F"/>
            <text x="0" y="-10" fill="#0F172A" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">330&Omega; PB5</text>
        </g>
        
        <g transform="translate(450,210)">
            <line x1="-25" y1="0" x2="25" y2="0" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
            <rect x="-14" y="-6" width="28" height="12" rx="3" fill="#FDE68A" stroke="#D97706" stroke-width="1.2"/>
            <rect x="-8" y="-6" width="3" height="12" fill="#B45309"/>
            <rect x="-2" y="-6" width="3" height="12" fill="#B45309"/>
            <rect x="4" y="-6" width="3" height="12" fill="#78350F"/>
            <text x="0" y="-10" fill="#0F172A" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">220&Omega; PB0</text>
        </g>
        
    <g>
        <path d="M 72 116.0 C 248.5 116.0, 248.5 150, 425 150" fill="none" stroke="#EF4444" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
        <circle cx="72" cy="116.0" r="3.5" fill="#EF4444"/>
        <circle cx="425" cy="150" r="3.5" fill="#EF4444"/>
    </g>
    <g>
        <path d="M 475 150 C 510.0 150, 510.0 210, 545 210" fill="none" stroke="#EF4444" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
        <circle cx="475" cy="150" r="3.5" fill="#EF4444"/>
        <circle cx="545" cy="210" r="3.5" fill="#EF4444"/>
    </g>
    <g>
        <path d="M 72 164.0 C 248.5 164.0, 248.5 180, 425 180" fill="none" stroke="#22C55E" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
        <circle cx="72" cy="164.0" r="3.5" fill="#22C55E"/>
        <circle cx="425" cy="180" r="3.5" fill="#22C55E"/>
    </g>
    <g>

        <text x="16" y="290.3333333333333" fill="#94A3B8" font-family="monospace" font-size="11" font-weight="bold">GND</text>
        <text x="64" y="289.8333333333333" fill="#CBD5E1" font-family="sans-serif" font-size="9">(Common Cathode GND)</text>
        <!-- Contact pad on far right edge -->

        <circle cx="244" cy="238.66666666666666" r="6" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="244" cy="238.66666666666666" r="2" fill="#0F172A"/>
        
        <!-- Pin: GND -->

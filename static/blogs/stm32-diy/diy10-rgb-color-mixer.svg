        <rect x="285.5" y="267.0" width="56" height="15" rx="3" fill="#FFFFFF" stroke="#0F172A" stroke-width="1" opacity="0.9"/>
        <text x="313.5" y="278.0" fill="#0F172A" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle">Cathode GND</text>
        </g></svg>
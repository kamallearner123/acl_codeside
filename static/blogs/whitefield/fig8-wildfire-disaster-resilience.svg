<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#141a29"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow8" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1000" height="620" fill="url(#bg8)" rx="16"/>

  <!-- Title Header -->
  <text x="50" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">
    Wildfire Emergency Sensor Mesh: Node Destruction &amp; RPL Healing
  </text>
  <text x="50" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
    Simulating Dynamic DODAG Repair, Infinite Rank Poisoning &amp; Autonomous Aerial Drone (UAV) Gateway Ingress
  </text>

  <!-- Main Map Container -->
  <g filter="url(#shadow8)" transform="translate(50, 105)">
    <rect width="900" height="375" rx="12" fill="#0d1b2a" stroke="#334155" stroke-width="1.5"/>

    <!-- Fire Propagation Front Overlay -->
    <path d="M 280 20 Q 340 180, 290 350 L 500 350 Q 550 180, 480 20 Z" fill="url(#fireGrad)" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="390" y="180" font-family="sans-serif" font-size="13" font-weight="700" fill="#f87171" text-anchor="middle">
      ADVANCING FIRE FRONT
    </text>
    <text x="390" y="200" font-family="sans-serif" font-size="10" fill="#fca5a5" text-anchor="middle">
      (Flames Destroying Sensor Nodes)
    </text>

    <!-- Zone 1: Incident Command Post (Safe Ridge) -->
    <g transform="translate(60, 40)">
      <rect width="180" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="90" y="25" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">INCIDENT COMMAND (ICP)</text>
      <text x="90" y="45" font-family="sans-serif" font-size="9" fill="#cbd5e1" text-anchor="middle">Base Station Root (DODAG Root)</text>
      <text x="90" y="62" font-family="sans-serif" font-size="9" fill="#cbd5e1" text-anchor="middle">Starlink Low-Earth Satellite Uplink</text>
      <text x="90" y="78" font-family="sans-serif" font-size="8" fill="#34d399" text-anchor="middle">&#10004; Operational (Online)</text>
    </g>

    <!-- Gateway Node 1 (Root) -->
    <circle cx="150" cy="170" r="16" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
    <text x="150" y="175" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">ROOT</text>

    <!-- Safe Relay Nodes -->
    <circle cx="100" cy="260" r="13" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="100" y="264" font-family="sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">S1</text>

    <circle cx="210" cy="270" r="13" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="210" y="274" font-family="sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">S2</text>

    <line x1="150" y1="186" x2="100" y2="247" stroke="#34d399" stroke-width="2"/>
    <line x1="150" y1="186" x2="210" y2="257" stroke="#34d399" stroke-width="2"/>

    <!-- Burning Nodes (Sequential Failure) -->
    <!-- Node F1: Burned -->
    <circle cx="340" cy="110" r="14" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
    <line x1="330" y1="100" x2="350" y2="120" stroke="#f87171" stroke-width="2"/>
    <line x1="350" y1="100" x2="330" y2="120" stroke="#f87171" stroke-width="2"/>
    <text x="340" y="140" font-family="sans-serif" font-size="8" fill="#fca5a5" text-anchor="middle">Node 7 (DEAD)</text>

    <!-- Node F2: Burned -->
    <circle cx="370" cy="240" r="14" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
    <line x1="360" y1="230" x2="380" y2="250" stroke="#f87171" stroke-width="2"/>
    <line x1="380" y1="230" x2="360" y2="250" stroke="#f87171" stroke-width="2"/>
    <text x="370" y="270" font-family="sans-serif" font-size="8" fill="#fca5a5" text-anchor="middle">Node 8 (DEAD)</text>

    <!-- Cut links -->
    <line x1="210" y1="270" x2="356" y2="244" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Isolated Far-Side Nodes (Cut off by flames) -->
    <circle cx="620" cy="120" r="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="620" y="124" font-family="sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">E1</text>
    <text x="620" y="98" font-family="sans-serif" font-size="9" fill="#f59e0b" text-anchor="middle">Thermal Sensor</text>

    <circle cx="760" cy="150" r="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="760" y="154" font-family="sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">E2</text>
    <text x="760" y="130" font-family="sans-serif" font-size="9" fill="#f59e0b" text-anchor="middle">CO2 / Smoke</text>

    <circle cx="700" cy="270" r="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="700" y="274" font-family="sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">E3</text>
    <text x="700" y="300" font-family="sans-serif" font-size="9" fill="#f59e0b" text-anchor="middle">Wind Velocity</text>

    <line x1="634" y1="124" x2="746" y2="146" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="760" y1="164" x2="700" y2="256" stroke="#f59e0b" stroke-width="1.5"/>

    <!-- Autonomous Aerial Drone (UAV) Ingress to restore connectivity -->
    <g transform="translate(480, 45)">
      <!-- Drone Icon -->
      <polygon points="40,20 60,35 40,50 20,35" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="15" y1="15" x2="65" y2="55" stroke="#94a3b8" stroke-width="2"/>
      <line x1="15" y1="55" x2="65" y2="15" stroke="#94a3b8" stroke-width="2"/>
      <circle cx="15" cy="15" r="4" fill="#38bdf8"/>
      <circle cx="65" cy="15" r="4" fill="#38bdf8"/>
      <circle cx="15" cy="55" r="4" fill="#38bdf8"/>
      <circle cx="65" cy="55" r="4" fill="#38bdf8"/>
      <text x="40" y="70" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">UAV RE-ANCHOR MESH</text>
    </g>

    <!-- Restored Aerial Links -->
    <line x1="520" y1="80" x2="166" y2="170" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,2"/>
    <line x1="520" y1="80" x2="620" y2="120" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="360" y="60" font-family="sans-serif" font-size="9" fill="#38bdf8">UAV Backhaul Relay</text>
    <text x="560" y="90" font-family="sans-serif" font-size="9" fill="#38bdf8">Emergency Parent Link</text>
  </g>

  <!-- Bottom: RPL Self-Healing Mechanics Explained -->
  <g transform="translate(50, 495)">
    <rect width="900" height="105" rx="8" fill="#111d31" stroke="#334155"/>
    <text x="25" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc">
      RPL Local Repair &amp; Dynamic Re-Convergence Verified by Whitefield Simulation
    </text>
    <text x="25" y="44" font-family="sans-serif" font-size="10" fill="#cbd5e1">
      1. Rank Poisoning: When Node 7 and 8 perish in fire, adjacent nodes immediately broadcast DIO with Infinite Rank (0xFFFF) to invalidate stale paths.
    </text>
    <text x="25" y="62" font-family="sans-serif" font-size="10" fill="#cbd5e1">
      2. Trickle Timer Reset: Nodes E1, E2, E3 detect loss of ACK, reset Trickle I_min to 125ms, actively soliciting new parents via ICMPv6 DIS packets.
    </text>
    <text x="25" y="80" font-family="sans-serif" font-size="10" fill="#34d399">
      3. Aerial Ingress Bridge: Autonomous drone broadcasts DIO beacon; isolated cluster re-attaches and resumes telemetry transmission in &lt; 2.8 seconds.
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111d31"/>
      <stop offset="100%" stop-color="#182944"/>
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1000" height="620" fill="url(#bg4)" rx="16"/>

  <!-- Title Header -->
  <text x="50" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">
    Smart Grid AMI: 100,000-Node Hybrid Wi-SUN RF &amp; G3-PLC Mesh Topology
  </text>
  <text x="50" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
    Simulating Head-End Systems (HES), Substation DCUs, Dual-PHY Fallback, and Trickle Timer Storm Mitigation
  </text>

  <!-- Top: Head-End System (Cloud/Utility Data Center) -->
  <g filter="url(#shadow4)" transform="translate(300, 105)">
    <rect width="400" height="70" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="200" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">UTILITY DATA CENTER / HEAD-END SYSTEM (HES)</text>
    <text x="200" y="50" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">DLMS/COSEM Billing Servers • Outage Management (OMS) • Meter Data (MDM)</text>
  </g>

  <!-- Trunk WAN link -->
  <line x1="500" y1="175" x2="500" y2="215" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="510" y="198" font-family="sans-serif" font-size="10" fill="#38bdf8">10GbE Fiber / 5G Cellular WAN</text>

  <!-- Middle: Data Concentrator Units (DCUs) / 6LBR -->
  <!-- DCU 1 -->
  <g filter="url(#shadow4)" transform="translate(120, 215)">
    <rect width="320" height="85" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="320" height="24" rx="10" fill="#b45309"/>
    <text x="160" y="17" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">SUBSTATION 1 DCU (6LBR ROOT)</text>
    <text x="15" y="42" font-family="sans-serif" font-size="11" fill="#f8fafc">Wi-SUN FAN Sub-GHz (865 MHz OFDM)</text>
    <text x="15" y="58" font-family="sans-serif" font-size="11" fill="#f8fafc">G3-PLC Power Line Transceiver (CENELEC-A)</text>
    <text x="15" y="74" font-family="sans-serif" font-size="10" fill="#fbbf24">RPL DODAG Root: Rank 256 • Capacity: 25k Nodes</text>
  </g>

  <!-- DCU 2 -->
  <g filter="url(#shadow4)" transform="translate(560, 215)">
    <rect width="320" height="85" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="320" height="24" rx="10" fill="#b45309"/>
    <text x="160" y="17" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">SUBSTATION 2 DCU (6LBR ROOT)</text>
    <text x="15" y="42" font-family="sans-serif" font-size="11" fill="#f8fafc">Wi-SUN FAN Sub-GHz (865 MHz FSK/OFDM)</text>
    <text x="15" y="58" font-family="sans-serif" font-size="11" fill="#f8fafc">G3-PLC Power Line Transceiver (ARIB Band)</text>
    <text x="15" y="74" font-family="sans-serif" font-size="10" fill="#fbbf24">RPL DODAG Root: Rank 256 • Capacity: 25k Nodes</text>
  </g>

  <!-- Bottom: Dense Mesh Smart Meter Clusters -->
  <g filter="url(#shadow4)" transform="translate(50, 335)">
    <rect width="900" height="250" rx="12" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1.5"/>

    <!-- Legend -->
    <rect x="20" y="15" width="860" height="30" rx="6" fill="#0f172a"/>
    <line x1="40" y1="30" x2="80" y2="30" stroke="#38bdf8" stroke-width="2"/>
    <text x="90" y="34" font-family="sans-serif" font-size="11" fill="#cbd5e1">Wi-SUN RF Link (Sub-GHz)</text>
    <line x1="260" y1="30" x2="300" y2="30" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="310" y="34" font-family="sans-serif" font-size="11" fill="#cbd5e1">G3-PLC Powerline Link</text>
    <circle cx="480" cy="30" r="6" fill="#10b981"/>
    <text x="495" y="34" font-family="sans-serif" font-size="11" fill="#cbd5e1">Dual-PHY Router Meter</text>
    <circle cx="660" cy="30" r="6" fill="#64748b"/>
    <text x="675" y="34" font-family="sans-serif" font-size="11" fill="#cbd5e1">Leaf / End Meter (Single PHY)</text>

    <!-- Cluster Nodes -->
    <!-- Substation 1 Feeder Branch -->
    <g transform="translate(60, 60)">
      <!-- Level 1 Repeaters -->
      <circle cx="80" cy="40" r="14" fill="#065f46" stroke="#34d399" stroke-width="2"/>
      <text x="80" y="44" font-family="sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">M1</text>

      <circle cx="220" cy="40" r="14" fill="#065f46" stroke="#34d399" stroke-width="2"/>
      <text x="220" y="44" font-family="sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">M2</text>

      <!-- Level 2 Meters -->
      <circle cx="30" cy="110" r="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="30" y="114" font-family="sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">M3</text>

      <circle cx="100" cy="110" r="14" fill="#065f46" stroke="#34d399" stroke-width="2"/>
      <text x="100" y="114" font-family="sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">M4</text>

      <circle cx="170" cy="110" r="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="170" y="114" font-family="sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">M5</text>

      <circle cx="250" cy="110" r="14" fill="#065f46" stroke="#34d399" stroke-width="2"/>
      <text x="250" y="114" font-family="sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">M6</text>

      <!-- Level 3 Deep Meters -->
      <circle cx="60" cy="165" r="10" fill="#334155"/>
      <text x="60" y="168" font-family="sans-serif" font-size="8" fill="#cbd5e1" text-anchor="middle">M7</text>

      <circle cx="130" cy="165" r="10" fill="#334155"/>
      <text x="130" y="168" font-family="sans-serif" font-size="8" fill="#cbd5e1" text-anchor="middle">M8</text>

      <circle cx="210" cy="165" r="10" fill="#334155"/>
      <text x="210" y="168" font-family="sans-serif" font-size="8" fill="#cbd5e1" text-anchor="middle">M9</text>

      <circle cx="290" cy="165" r="10" fill="#334155"/>
      <text x="290" y="168" font-family="sans-serif" font-size="8" fill="#cbd5e1" text-anchor="middle">M10</text>

      <!-- Lines Level 1 to 2 -->
      <line x1="80" y1="54" x2="30" y2="98" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="80" y1="54" x2="100" y2="96" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>
      <line x1="220" y1="54" x2="170" y2="98" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="220" y1="54" x2="250" y2="96" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>

      <!-- Lines Level 2 to 3 -->
      <line x1="100" y1="124" x2="60" y2="155" stroke="#38bdf8" stroke-width="1.2"/>
      <line x1="100" y1="124" x2="130" y2="155" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3,3"/>
      <line x1="250" y1="124" x2="210" y2="155" stroke="#38bdf8" stroke-width="1.2"/>
      <line x1="250" y1="124" x2="290" y2="155" stroke="#38bdf8" stroke-width="1.2"/>

      <text x="160" y="195" font-family="sans-serif" font-size="11" font-weight="600" fill="#a5b4fc" text-anchor="middle">
        Transformer Zone A (Dense Urban Low-Voltage Feeder)
      </text>
    </g>

    <!-- Substation 2 Feeder Branch -->
    <g transform="translate(500, 60)">
      <circle cx="80" cy="40" r="14" fill="#065f46" stroke="#34d399" stroke-width="2"/>
      <text x="80" y="44" font-family="sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">M11</text>

      <circle cx="220" cy="40" r="14" fill="#065f46" stroke="#34d399" stroke-width="2"/>
      <text x="220" y="44" font-family="sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">M12</text>

      <circle cx="40" cy="110" r="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="40" y="114" font-family="sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">M13</text>

      <circle cx="120" cy="110" r="14" fill="#065f46" stroke="#34d399" stroke-width="2"/>
      <text x="120" y="114" font-family="sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">M14</text>

      <circle cx="200" cy="110" r="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="200" y="114" font-family="sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">M15</text>

      <circle cx="280" cy="110" r="14" fill="#065f46" stroke="#34d399" stroke-width="2"/>
      <text x="280" y="114" font-family="sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">M16</text>

      <!-- Deep meters -->
      <circle cx="80" cy="165" r="10" fill="#334155"/>
      <text x="80" y="168" font-family="sans-serif" font-size="8" fill="#cbd5e1" text-anchor="middle">M17</text>

      <circle cx="160" cy="165" r="10" fill="#334155"/>
      <text x="160" y="168" font-family="sans-serif" font-size="8" fill="#cbd5e1" text-anchor="middle">M18</text>

      <circle cx="240" cy="165" r="10" fill="#334155"/>
      <text x="240" y="168" font-family="sans-serif" font-size="8" fill="#cbd5e1" text-anchor="middle">M19</text>

      <line x1="80" y1="54" x2="40" y2="98" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="80" y1="54" x2="120" y2="96" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>
      <line x1="220" y1="54" x2="200" y2="98" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="220" y1="54" x2="280" y2="96" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>

      <line x1="120" y1="124" x2="80" y2="155" stroke="#38bdf8" stroke-width="1.2"/>
      <line x1="120" y1="124" x2="160" y2="155" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3,3"/>
      <line x1="280" y1="124" x2="240" y2="155" stroke="#38bdf8" stroke-width="1.2"/>

      <text x="160" y="195" font-family="sans-serif" font-size="11" font-weight="600" fill="#a5b4fc" text-anchor="middle">
        Transformer Zone B (Industrial Parks &amp; Commercial Units)
      </text>
    </g>
  </g>
</svg>

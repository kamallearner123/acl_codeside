<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow7" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1000" height="620" fill="url(#bg7)" rx="16"/>

  <!-- Title Header -->
  <text x="50" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">
    Matter over Thread (OpenThread): Multi-Floor Building &amp; Partition Recovery
  </text>
  <text x="50" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
    Simulating Thread Border Router Failover, Leader Election, MLE Link Probing &amp; Partition Merge Dynamics
  </text>

  <!-- Left: Commercial Building Infrastructure Layer -->
  <g filter="url(#shadow7)" transform="translate(50, 105)">
    <rect width="420" height="380" rx="10" fill="#111d31" stroke="#334155" stroke-width="1.5"/>

    <!-- Floor 3 -->
    <rect x="20" y="20" width="380" height="100" rx="6" fill="#1e293b"/>
    <text x="35" y="42" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">FLOOR 3: Executive Suites &amp; Boardrooms</text>

    <!-- Floor 3 Nodes -->
    <circle cx="60" cy="75" r="14" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
    <text x="60" y="79" font-family="sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">OTBR1</text>

    <circle cx="160" cy="75" r="12" fill="#15803d" stroke="#4ade80" stroke-width="1.5"/>
    <text x="160" y="79" font-family="sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">R1</text>

    <circle cx="260" cy="75" r="12" fill="#15803d" stroke="#4ade80" stroke-width="1.5"/>
    <text x="260" y="79" font-family="sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">R2</text>

    <circle cx="350" cy="75" r="10" fill="#64748b"/>
    <text x="350" y="79" font-family="sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">SED1</text>

    <line x1="74" y1="75" x2="148" y2="75" stroke="#38bdf8" stroke-width="2"/>
    <line x1="172" y1="75" x2="248" y2="75" stroke="#4ade80" stroke-width="2"/>
    <line x1="272" y1="75" x2="340" y2="75" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2"/>

    <!-- Floor 2 -->
    <rect x="20" y="135" width="380" height="100" rx="6" fill="#1e293b"/>
    <text x="35" y="157" font-family="sans-serif" font-size="12" font-weight="700" fill="#a855f7">FLOOR 2: Open Workstations &amp; Labs</text>

    <!-- Floor 2 Nodes -->
    <circle cx="60" cy="190" r="14" fill="#a21caf" stroke="#f472b6" stroke-width="2"/>
    <text x="60" y="194" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">LEADER</text>

    <circle cx="160" cy="190" r="12" fill="#15803d" stroke="#4ade80" stroke-width="1.5"/>
    <text x="160" y="194" font-family="sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">R3</text>

    <circle cx="260" cy="190" r="12" fill="#15803d" stroke="#4ade80" stroke-width="1.5"/>
    <text x="260" y="194" font-family="sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">R4</text>

    <circle cx="350" cy="190" r="10" fill="#64748b"/>
    <text x="350" y="194" font-family="sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">SED2</text>

    <line x1="74" y1="190" x2="148" y2="190" stroke="#f472b6" stroke-width="2"/>
    <line x1="172" y1="190" x2="248" y2="190" stroke="#4ade80" stroke-width="2"/>
    <line x1="272" y1="190" x2="340" y2="190" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2"/>

    <!-- Floor 1 -->
    <rect x="20" y="250" width="380" height="110" rx="6" fill="#1e293b"/>
    <text x="35" y="272" font-family="sans-serif" font-size="12" font-weight="700" fill="#f59e0b">FLOOR 1: Lobby, Security &amp; Mechanical Rooms</text>

    <circle cx="60" cy="310" r="14" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
    <text x="60" y="314" font-family="sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">OTBR2</text>

    <circle cx="160" cy="310" r="12" fill="#15803d" stroke="#4ade80" stroke-width="1.5"/>
    <text x="160" y="314" font-family="sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">R5</text>

    <circle cx="260" cy="310" r="12" fill="#15803d" stroke="#4ade80" stroke-width="1.5"/>
    <text x="260" y="314" font-family="sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">R6</text>

    <circle cx="350" cy="310" r="10" fill="#64748b"/>
    <text x="350" y="314" font-family="sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">SED3</text>

    <line x1="74" y1="310" x2="148" y2="310" stroke="#38bdf8" stroke-width="2"/>
    <line x1="172" y1="310" x2="248" y2="310" stroke="#4ade80" stroke-width="2"/>
    <line x1="272" y1="310" x2="340" y2="310" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2,2"/>

    <!-- Inter-floor slab attenuation links -->
    <line x1="60" y1="89" x2="60" y2="176" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="60" y1="204" x2="60" y2="296" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="160" y1="87" x2="160" y2="178" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>

  <!-- Right: Dynamic Partition & Resilience Simulation in Whitefield -->
  <g filter="url(#shadow7)" transform="translate(500, 105)">
    <rect width="450" height="380" rx="10" fill="#111d31" stroke="#334155" stroke-width="1.5"/>

    <text x="25" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#f8fafc">
      CHAOS TEST: OTBR CRASH &amp; DYNAMIC RE-ELECTION
    </text>

    <!-- Step 1 -->
    <rect x="20" y="50" width="410" height="65" rx="6" fill="#1e293b"/>
    <circle cx="45" cy="82" r="12" fill="#ef4444"/>
    <text x="45" y="86" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="70" y="73" font-family="sans-serif" font-size="11" font-weight="700" fill="#f87171">OTBR 1 Process Terminated (Chaos Injection)</text>
    <text x="70" y="92" font-family="sans-serif" font-size="10" fill="#cbd5e1">
      Whitefield cuts Linux process socket. Floor 3 isolated from Ethernet uplink.
    </text>

    <!-- Step 2 -->
    <rect x="20" y="125" width="410" height="75" rx="6" fill="#1e293b"/>
    <circle cx="45" cy="162" r="12" fill="#f59e0b"/>
    <text x="45" y="166" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="70" y="148" font-family="sans-serif" font-size="11" font-weight="700" fill="#fbbf24">Network Partition Detection &amp; Child Re-attachment</text>
    <text x="70" y="167" font-family="sans-serif" font-size="10" fill="#cbd5e1">
      Nodes R1 &amp; R2 miss 4 consecutive MLE Heartbeats (8s).
    </text>
    <text x="70" y="185" font-family="sans-serif" font-size="10" fill="#cbd5e1">
      R1 increments Partition ID, triggers MLE Parent Request down stairwell.
    </text>

    <!-- Step 3 -->
    <rect x="20" y="210" width="410" height="75" rx="6" fill="#1e293b"/>
    <circle cx="45" cy="247" r="12" fill="#10b981"/>
    <text x="45" y="251" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="70" y="233" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399">Autonomous Leader Handover &amp; OTBR2 Rerouting</text>
    <text x="70" y="252" font-family="sans-serif" font-size="10" fill="#cbd5e1">
      Floor 2 Leader accepts R1 attach. Thread SLAAC updates default IPv6 route.
    </text>
    <text x="70" y="270" font-family="sans-serif" font-size="10" fill="#cbd5e1">
      All Matter packets failover to OTBR2 in 1.4 seconds without user perception.
    </text>

    <!-- Summary box -->
    <rect x="20" y="295" width="410" height="70" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="35" y="320" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399">Whitefield Matter/Thread Test Results:</text>
    <text x="35" y="338" font-family="sans-serif" font-size="10" fill="#cbd5e1">&#8226; End-to-End Packet Loss during Failover: 0.12%</text>
    <text x="35" y="354" font-family="sans-serif" font-size="10" fill="#cbd5e1">&#8226; Thread Partition Merge Latency: 1,420 ms (Complies with Thread 1.3 spec)</text>
  </g>

  <!-- Bottom: Matter Protocol Stack on Thread -->
  <g transform="translate(50, 500)">
    <rect width="900" height="100" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="25" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc">
      Matter Application Layer over OpenThread IPv6 Mesh Stack in Whitefield
    </text>
    <text x="25" y="44" font-family="sans-serif" font-size="10" fill="#94a3b8">
      Layer 7: Matter Interaction Model (Clusters, Attributes, Commands, Subscriptions)
    </text>
    <text x="25" y="60" font-family="sans-serif" font-size="10" fill="#94a3b8">
      Layer 4-6: MRP (Message Reliability Protocol) + BTP (BLE Transport) + UDP Unicast / Multicast + CASE / PASE Security
    </text>
    <text x="25" y="78" font-family="sans-serif" font-size="10" fill="#cbd5e1">
      Layer 1-3: IPv6 + 6LoWPAN HC + MLE + IEEE 802.15.4 MAC (Directly executed via native OpenThread C++ code in Whitefield)
    </text>
  </g>
</svg>

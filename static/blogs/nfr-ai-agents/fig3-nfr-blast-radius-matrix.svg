<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" style="background:#0b0f19; font-family:'Inter',system-ui,sans-serif;">
  <defs>
    <linearGradient id="card-tier1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="card-tier2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="card-tier3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <filter id="shadow-tier" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="550" y="38" text-anchor="middle" fill="#38bdf8" font-size="20" font-weight="800" letter-spacing="1">FIGURE 3: THE AUTONOMOUS BLAST RADIUS &amp; HITL GUARDRAIL MATRIX</text>
  <text x="550" y="62" text-anchor="middle" fill="#94a3b8" font-size="13">Structuring Security, Safety &amp; Compliance NFRs into Hard Architectural Autonomy Gates</text>

  <!-- Tier 1: Low Blast Radius (Fully Autonomous) -->
  <g transform="translate(50, 95)" filter="url(#shadow-tier)">
    <rect width="310" height="470" rx="12" fill="url(#card-tier1)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="310" height="38" rx="12" fill="#059669"/>
    <text x="155" y="24" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">TIER 1: FULLY AUTONOMOUS</text>
    
    <text x="20" y="65" fill="#a7f3d0" font-size="12" font-weight="700">Risk Profile: Negligible / Read-Only</text>
    <text x="20" y="85" fill="#cbd5e1" font-size="11">Side-effects: <strong>Zero Data Mutation</strong></text>

    <!-- Sub-boxes -->
    <rect x="15" y="105" width="280" height="75" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="25" y="125" fill="#34d399" font-size="11" font-weight="700">Permitted Actions:</text>
    <text x="25" y="145" fill="#94a3b8" font-size="10">&bull; Read-only SQL queries via replica DB</text>
    <text x="25" y="162" fill="#94a3b8" font-size="10">&bull; Semantic document search (RAG)</text>

    <rect x="15" y="195" width="280" height="90" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="25" y="215" fill="#34d399" font-size="11" font-weight="700">Security NFR Enforcements:</text>
    <text x="25" y="235" fill="#94a3b8" font-size="10">&bull; Read-only database user credentials</text>
    <text x="25" y="252" fill="#94a3b8" font-size="10">&bull; PII regex scrubbing on outputs</text>
    <text x="25" y="269" fill="#94a3b8" font-size="10">&bull; Max context search tokens &lt; 8k</text>

    <rect x="15" y="300" width="280" height="95" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="25" y="320" fill="#34d399" font-size="11" font-weight="700">Failure Consequence:</text>
    <text x="25" y="340" fill="#94a3b8" font-size="10">Mild hallucination in text summary. Zero customer impact, zero financial loss. Automatically logged for evaluation review.</text>

    <rect x="15" y="415" width="280" height="35" rx="6" fill="#059669"/>
    <text x="155" y="437" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Gate: 100% Machine Automated</text>
  </g>

  <!-- Tier 2: Medium Blast Radius (Asynchronous Audit) -->
  <g transform="translate(395, 95)" filter="url(#shadow-tier)">
    <rect width="310" height="470" rx="12" fill="url(#card-tier2)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="310" height="38" rx="12" fill="#d97706"/>
    <text x="155" y="24" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">TIER 2: ASYNC HUMAN AUDIT</text>
    
    <text x="20" y="65" fill="#fde68a" font-size="12" font-weight="700">Risk Profile: Moderate / Staged Writes</text>
    <text x="20" y="85" fill="#cbd5e1" font-size="11">Side-effects: <strong>Reversible Mutations</strong></text>

    <!-- Sub-boxes -->
    <rect x="15" y="105" width="280" height="75" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="25" y="125" fill="#fbbf24" font-size="11" font-weight="700">Permitted Actions:</text>
    <text x="25" y="145" fill="#94a3b8" font-size="10">&bull; Draft customer email responses</text>
    <text x="25" y="162" fill="#94a3b8" font-size="10">&bull; Create low-priority Jira tickets / PRs</text>

    <rect x="15" y="195" width="280" height="90" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="25" y="215" fill="#fbbf24" font-size="11" font-weight="700">Security NFR Enforcements:</text>
    <text x="25" y="235" fill="#94a3b8" font-size="10">&bull; Actions written to staging buffer DB</text>
    <text x="25" y="252" fill="#94a3b8" font-size="10">&bull; 4-hour supervisor review queue SLA</text>
    <text x="25" y="269" fill="#94a3b8" font-size="10">&bull; Reversibility undo snapshot generated</text>

    <rect x="15" y="300" width="280" height="95" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="25" y="320" fill="#fbbf24" font-size="11" font-weight="700">Failure Consequence:</text>
    <text x="25" y="340" fill="#94a3b8" font-size="10">Incorrect draft email or mislabeled ticket. Caught by human reviewer during audit SLA before impacting end user.</text>

    <rect x="15" y="415" width="280" height="35" rx="6" fill="#d97706"/>
    <text x="155" y="437" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Gate: Asynchronous Supervisor Review</text>
  </g>

  <!-- Tier 3: High Blast Radius (Synchronous Human Gate) -->
  <g transform="translate(740, 95)" filter="url(#shadow-tier)">
    <rect width="310" height="470" rx="12" fill="url(#card-tier3)" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="0" y="0" width="310" height="38" rx="12" fill="#dc2626"/>
    <text x="155" y="24" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">TIER 3: SYNCHRONOUS HUMAN GATE</text>
    
    <text x="20" y="65" fill="#fca5a5" font-size="12" font-weight="700">Risk Profile: Critical / Permanent</text>
    <text x="20" y="85" fill="#cbd5e1" font-size="11">Side-effects: <strong>Irreversible / Financial / PII</strong></text>

    <!-- Sub-boxes -->
    <rect x="15" y="105" width="280" height="75" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
    <text x="25" y="125" fill="#f87171" font-size="11" font-weight="700">Permitted Actions:</text>
    <text x="25" y="145" fill="#94a3b8" font-size="10">&bull; Financial transactions &gt; $50 USD</text>
    <text x="25" y="162" fill="#94a3b8" font-size="10">&bull; Drop table / Delete user account / Deploy</text>

    <rect x="15" y="195" width="280" height="90" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
    <text x="25" y="215" fill="#f87171" font-size="11" font-weight="700">Security NFR Enforcements:</text>
    <text x="25" y="235" fill="#94a3b8" font-size="10">&bull; State frozen in Postgres checkpoint</text>
    <text x="25" y="252" fill="#94a3b8" font-size="10">&bull; Webhook sent to Slack/Teams with 2FA</text>
    <text x="25" y="269" fill="#94a3b8" font-size="10">&bull; Mandatory human approval to resume</text>

    <rect x="15" y="300" width="280" height="95" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
    <text x="25" y="320" fill="#f87171" font-size="11" font-weight="700">Failure Consequence:</text>
    <text x="25" y="340" fill="#94a3b8" font-size="10">Without this gate: Unintended financial drain, unauthorized database wipes, SOC2 breach, or SEC non-compliance.</text>

    <rect x="15" y="415" width="280" height="35" rx="6" fill="#dc2626"/>
    <text x="155" y="437" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Gate: Mandatory 2FA Human Approval</text>
  </g>

  <!-- Footer Insight -->
  <text x="550" y="605" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">Enterprise Rule: An AI Agent must never possess higher unmonitored production privileges than a Junior Human Engineer.</text>
</svg>

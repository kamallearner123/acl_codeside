<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%" style="background:#0b0f19; font-family:'Inter',system-ui,sans-serif;">
  <defs>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow-nfr" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" fill="#38bdf8" font-size="20" font-weight="800" letter-spacing="1">FIGURE 2: ENTERPRISE AI AGENT NON-FUNCTIONAL REQUIREMENTS (NFR) FRAMEWORK</text>
  <text x="550" y="65" text-anchor="middle" fill="#94a3b8" font-size="13">The 7 Quantitative Dimensions Engineering Teams Must Elicit Before Writing Prompts</text>

  <!-- NFR Grid (3 top, 3 middle, 1 full-width bottom) -->

  <!-- Card 1: Latency & Responsiveness -->
  <g transform="translate(50, 95)" filter="url(#shadow-nfr)">
    <rect width="310" height="165" rx="10" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="0" y="0" width="310" height="32" rx="10" fill="#0284c7"/>
    <text x="15" y="21" fill="#fff" font-size="13" font-weight="700">1. Latency &amp; Responsiveness</text>
    <text x="15" y="55" fill="#f8fafc" font-size="11" font-weight="600">Metric Targets:</text>
    <text x="15" y="73" fill="#94a3b8" font-size="11">&bull; TTFT (Time to First Token) &lt; 800ms</text>
    <text x="15" y="91" fill="#94a3b8" font-size="11">&bull; Max turn duration &lt; 3.5s</text>
    <text x="15" y="109" fill="#94a3b8" font-size="11">&bull; End-to-end task ceiling &lt; 25s</text>
    <rect x="15" y="123" width="280" height="26" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="140" fill="#38bdf8" font-size="10" font-weight="600">Collection: User Journey Turn Budget SLA</text>
  </g>

  <!-- Card 2: Cost & Token Economics -->
  <g transform="translate(395, 95)" filter="url(#shadow-nfr)">
    <rect width="310" height="165" rx="10" fill="url(#card-grad)" stroke="#10b981" stroke-width="1.2"/>
    <rect x="0" y="0" width="310" height="32" rx="10" fill="#059669"/>
    <text x="15" y="21" fill="#fff" font-size="13" font-weight="700">2. Cost &amp; Token Economics</text>
    <text x="15" y="55" fill="#f8fafc" font-size="11" font-weight="600">Metric Targets:</text>
    <text x="15" y="73" fill="#94a3b8" font-size="11">&bull; Unit cost &lt; $0.015 per completed goal</text>
    <text x="15" y="91" fill="#94a3b8" font-size="11">&bull; Context window caching ratio &gt; 65%</text>
    <text x="15" y="109" fill="#94a3b8" font-size="11">&bull; Tiered routing (Small/Fast vs Heavy)</text>
    <rect x="15" y="123" width="280" height="26" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="140" fill="#34d399" font-size="10" font-weight="600">Collection: Unit Economics &amp; Margin Model</text>
  </g>

  <!-- Card 3: Determinism & Reliability -->
  <g transform="translate(740, 95)" filter="url(#shadow-nfr)">
    <rect width="310" height="165" rx="10" fill="url(#card-grad)" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="0" y="0" width="310" height="32" rx="10" fill="#d97706"/>
    <text x="15" y="21" fill="#fff" font-size="13" font-weight="700">3. Determinism &amp; Reliability</text>
    <text x="15" y="55" fill="#f8fafc" font-size="11" font-weight="600">Metric Targets:</text>
    <text x="15" y="73" fill="#94a3b8" font-size="11">&bull; Tool call schema accuracy: 99.8%</text>
    <text x="15" y="91" fill="#94a3b8" font-size="11">&bull; Golden evaluation pass@1 &gt; 92%</text>
    <text x="15" y="109" fill="#94a3b8" font-size="11">&bull; Bounded max turns = 5 (loop breaker)</text>
    <rect x="15" y="123" width="280" height="26" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="140" fill="#fbbf24" font-size="10" font-weight="600">Collection: Minimum Acceptable Pass Rates</text>
  </g>

  <!-- Card 4: Security & Blast Radius Isolation -->
  <g transform="translate(50, 285)" filter="url(#shadow-nfr)">
    <rect width="310" height="165" rx="10" fill="url(#card-grad)" stroke="#ef4444" stroke-width="1.2"/>
    <rect x="0" y="0" width="310" height="32" rx="10" fill="#dc2626"/>
    <text x="15" y="21" fill="#fff" font-size="13" font-weight="700">4. Security &amp; Isolation</text>
    <text x="15" y="55" fill="#f8fafc" font-size="11" font-weight="600">Metric Targets:</text>
    <text x="15" y="73" fill="#94a3b8" font-size="11">&bull; Prompt injection resistance &gt; 99.9%</text>
    <text x="15" y="91" fill="#94a3b8" font-size="11">&bull; Read-only tool scopes by default</text>
    <text x="15" y="109" fill="#94a3b8" font-size="11">&bull; Ephemeral containers for code exec</text>
    <rect x="15" y="123" width="280" height="26" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="140" fill="#f87171" font-size="10" font-weight="600">Collection: Threat Model &amp; Least Privilege RBAC</text>
  </g>

  <!-- Card 5: Compliance & Auditability -->
  <g transform="translate(395, 285)" filter="url(#shadow-nfr)">
    <rect width="310" height="165" rx="10" fill="url(#card-grad)" stroke="#8b5cf6" stroke-width="1.2"/>
    <rect x="0" y="0" width="310" height="32" rx="10" fill="#7c3aed"/>
    <text x="15" y="21" fill="#fff" font-size="13" font-weight="700">5. Governance &amp; Compliance</text>
    <text x="15" y="55" fill="#f8fafc" font-size="11" font-weight="600">Metric Targets:</text>
    <text x="15" y="73" fill="#94a3b8" font-size="11">&bull; Full deterministic trajectory replay</text>
    <text x="15" y="91" fill="#94a3b8" font-size="11">&bull; Zero data retention on third-party APIs</text>
    <text x="15" y="109" fill="#94a3b8" font-size="11">&bull; Automated PII masking before inference</text>
    <rect x="15" y="123" width="280" height="26" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="140" fill="#c084fc" font-size="10" font-weight="600">Collection: SOC2, HIPAA &amp; EU AI Act Criteria</text>
  </g>

  <!-- Card 6: Concurrency & Rate Limiting -->
  <g transform="translate(740, 285)" filter="url(#shadow-nfr)">
    <rect width="310" height="165" rx="10" fill="url(#card-grad)" stroke="#ec4899" stroke-width="1.2"/>
    <rect x="0" y="0" width="310" height="32" rx="10" fill="#db2777"/>
    <text x="15" y="21" fill="#fff" font-size="13" font-weight="700">6. Scalability &amp; Resilience</text>
    <text x="15" y="55" fill="#f8fafc" font-size="11" font-weight="600">Metric Targets:</text>
    <text x="15" y="73" fill="#94a3b8" font-size="11">&bull; Peak throughput: 500 tasks/min</text>
    <text x="15" y="91" fill="#94a3b8" font-size="11">&bull; Automatic failover across 2+ providers</text>
    <text x="15" y="109" fill="#94a3b8" font-size="11">&bull; Exponential backoff with jitter on 429</text>
    <rect x="15" y="123" width="280" height="26" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="140" fill="#f472b6" font-size="10" font-weight="600">Collection: Peak Traffic Modeling &amp; TPM Caps</text>
  </g>

  <!-- Card 7: Human-in-the-Loop (HITL) Thresholds (Full Width Banner) -->
  <g transform="translate(50, 475)" filter="url(#shadow-nfr)">
    <rect width="1000" height="140" rx="12" fill="url(#card-grad)" stroke="#6366f1" stroke-width="1.4"/>
    <rect x="0" y="0" width="1000" height="32" rx="12" fill="#4f46e5"/>
    <text x="20" y="21" fill="#fff" font-size="13" font-weight="700">7. Human-in-the-Loop (HITL) Autonomy &amp; Action Tiering Protocol</text>

    <!-- 3 Tier Sub-boxes -->
    <g transform="translate(20, 45)">
      <rect width="300" height="75" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="15" y="22" fill="#34d399" font-size="12" font-weight="700">Tier 1: Fully Autonomous</text>
      <text x="15" y="42" fill="#94a3b8" font-size="10">&bull; Read-only data queries, documentation search</text>
      <text x="15" y="58" fill="#94a3b8" font-size="10">&bull; Safe intermediate data transformations</text>
    </g>

    <g transform="translate(350, 45)">
      <rect width="300" height="75" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
      <text x="15" y="22" fill="#fbbf24" font-size="12" font-weight="700">Tier 2: Asynchronous Review</text>
      <text x="15" y="42" fill="#94a3b8" font-size="10">&bull; Draft communications, non-critical database writes</text>
      <text x="15" y="58" fill="#94a3b8" font-size="10">&bull; Queued for batch manager audit within 4 hours</text>
    </g>

    <g transform="translate(680, 45)">
      <rect width="300" height="75" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
      <text x="15" y="22" fill="#f87171" font-size="12" font-weight="700">Tier 3: Synchronous Human Gate</text>
      <text x="15" y="42" fill="#94a3b8" font-size="10">&bull; Financial transactions &gt; $50, database drops</text>
      <text x="15" y="58" fill="#94a3b8" font-size="10">&bull; Mandatory 2FA web-hook approval to resume state</text>
    </g>
  </g>

  <!-- Footer note -->
  <text x="550" y="650" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">Crucial Takeaway: Without concrete NFRs, an agent project is merely a research prototype, not an enterprise software product.</text>
</svg>

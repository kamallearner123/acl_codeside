<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680" style="background:#0b0f19; font-family:'Inter',system-ui,sans-serif;">
  <defs>
    <linearGradient id="box-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="inner-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1b4e"/>
      <stop offset="100%" stop-color="#15102a"/>
    </linearGradient>
    <filter id="shadow-arch" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="550" y="38" text-anchor="middle" fill="#38bdf8" font-size="20" font-weight="800" letter-spacing="1">FIGURE 3: THE DUAL-LOOP ARCHITECTURE OF ENTERPRISE AI AGENTS</text>
  <text x="550" y="62" text-anchor="middle" fill="#94a3b8" font-size="13">Deterministic Systems Engineering Encapsulating Probabilistic Cognitive Reasoning</text>

  <!-- Outer Layer: Deterministic Software Boundary (80% Traditional Software) -->
  <rect x="40" y="85" width="1020" height="540" rx="18" fill="rgba(30, 41, 59, 0.35)" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8,5"/>
  <rect x="60" y="73" width="370" height="24" rx="6" fill="#1d4ed8"/>
  <text x="75" y="89" fill="#fff" font-size="11" font-weight="800" letter-spacing="0.5">OUTER DETERMINISTIC HARNESS (Traditional Software Eng)</text>

  <!-- Left: Ingress & Deterministic Pre-Processing -->
  <g transform="translate(65, 115)" filter="url(#shadow-arch)">
    <rect width="230" height="480" rx="12" fill="url(#box-grad-dark)" stroke="#334155" stroke-width="1.2"/>
    <text x="115" y="30" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="700">1. Ingress &amp; Safety</text>
    <line x1="20" y1="45" x2="210" y2="45" stroke="#334155" stroke-width="1"/>

    <!-- Micro-boxes -->
    <rect x="20" y="60" width="190" height="45" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="115" y="80" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">API Gateway / Auth</text>
    <text x="115" y="95" text-anchor="middle" fill="#64748b" font-size="10">JWT, OAuth2, Tenant Scopes</text>

    <rect x="20" y="120" width="190" height="45" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
    <text x="115" y="140" text-anchor="middle" fill="#f87171" font-size="11" font-weight="700">Prompt Injection Shield</text>
    <text x="115" y="155" text-anchor="middle" fill="#64748b" font-size="10">Regex, Llama-Guard, Canary tokens</text>

    <rect x="20" y="180" width="190" height="45" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="115" y="200" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="700">PII Masking &amp; Anonymizer</text>
    <text x="115" y="215" text-anchor="middle" fill="#64748b" font-size="10">Presidio / RegEx scrubbing</text>

    <rect x="20" y="240" width="190" height="45" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="115" y="260" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">State Rehydration Store</text>
    <text x="115" y="275" text-anchor="middle" fill="#64748b" font-size="10">Redis / Postgres Session History</text>

    <rect x="20" y="300" width="190" height="45" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
    <text x="115" y="320" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="700">Rate Limiter &amp; Token Budget</text>
    <text x="115" y="335" text-anchor="middle" fill="#64748b" font-size="10">Token bucket, Leaky bucket</text>

    <rect x="20" y="360" width="190" height="85" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <text x="115" y="385" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="700">Telemetry &amp; Audit Spans</text>
    <text x="115" y="405" text-anchor="middle" fill="#94a3b8" font-size="10">&bull; OpenTelemetry Context</text>
    <text x="115" y="420" text-anchor="middle" fill="#94a3b8" font-size="10">&bull; Session Trace ID Generation</text>
    <text x="115" y="435" text-anchor="middle" fill="#94a3b8" font-size="10">&bull; Immutable Event Ledger</text>
  </g>

  <!-- Center: Inner Stochastic ReAct Loop (20% Probabilistic Reasoning) -->
  <g transform="translate(325, 115)" filter="url(#shadow-arch)">
    <rect width="440" height="480" rx="14" fill="url(#inner-grad)" stroke="#a855f7" stroke-width="2"/>
    <rect x="20" y="-12" width="280" height="24" rx="6" fill="#9333ea"/>
    <text x="35" y="4" fill="#fff" font-size="11" font-weight="800">INNER STOCHASTIC REASONING LOOP</text>

    <!-- Step 1: Context Assembler -->
    <rect x="30" y="35" width="380" height="50" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
    <text x="220" y="56" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="700">Dynamic Context Assembler &amp; Prompt Compiler</text>
    <text x="220" y="73" text-anchor="middle" fill="#a5b4fc" font-size="10">System Instructions + Short-term Memory + Available Tool Schemas</text>

    <!-- Arrow Down -->
    <line x1="220" y1="85" x2="220" y2="105" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 2: Foundation Model Inference -->
    <rect x="30" y="105" width="380" height="75" rx="8" fill="#1e1b4b" stroke="#ec4899" stroke-width="1.5"/>
    <text x="220" y="128" text-anchor="middle" fill="#f472b6" font-size="13" font-weight="800">LLM Inference (Probabilistic Reasoner)</text>
    <text x="220" y="146" text-anchor="middle" fill="#fbcfe8" font-size="10">Generates Chain-of-Thought Reasoning or Formulates Tool Call</text>
    <text x="220" y="162" text-anchor="middle" fill="#94a3b8" font-size="9">Supports: Claude 3.5 Sonnet / GPT-4o / DeepSeek-V3 / Grok-2</text>

    <!-- Decision Diamond -->
    <polygon points="220,200 290,235 220,270 150,235" fill="#312e81" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="220" y="233" text-anchor="middle" fill="#fde047" font-size="10" font-weight="700">Tool Call</text>
    <text x="220" y="246" text-anchor="middle" fill="#fde047" font-size="10" font-weight="700">Requested?</text>

    <!-- Branch No -> Final Answer -->
    <line x1="150" y1="235" x2="80" y2="235" stroke="#10b981" stroke-width="1.5"/>
    <line x1="80" y1="235" x2="80" y2="390" stroke="#10b981" stroke-width="1.5"/>
    <text x="110" y="228" fill="#34d399" font-size="10" font-weight="700">NO</text>

    <!-- Branch Yes -> Tool Call Handling -->
    <line x1="290" y1="235" x2="350" y2="235" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="350" y1="235" x2="350" y2="290" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="310" y="228" fill="#fbbf24" font-size="10" font-weight="700">YES</text>

    <!-- Schema Validation & Bounds -->
    <rect x="180" y="290" width="230" height="55" rx="6" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="295" y="310" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">Pydantic Argument Validator</text>
    <text x="295" y="326" text-anchor="middle" fill="#fde68a" font-size="9">Strict JSON Schema Parse &amp; Turn Limit Check</text>
    <text x="295" y="338" text-anchor="middle" fill="#94a3b8" font-size="9">(Turn &lt; Max_Turns? Else break loop)</text>

    <!-- Sandboxed Tool Execution -->
    <rect x="180" y="365" width="230" height="55" rx="6" fill="#1e1b4b" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="295" y="385" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="700">Sandboxed Tool Dispatcher</text>
    <text x="295" y="401" text-anchor="middle" fill="#a5f3fc" font-size="9">MCP Server / REST / DB Query / Code Exec</text>
    <text x="295" y="413" text-anchor="middle" fill="#94a3b8" font-size="9">Captures Observation Result</text>

    <!-- Loop Back Arrow to Context Assembler -->
    <path d="M 410 392 Q 430 392 430 200 T 410 60" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-dasharray="4,3"/>
    <text x="430" y="210" fill="#c084fc" font-size="9" font-weight="700" transform="rotate(90, 430, 210)">OBSERVE &amp; RE-ENTER</text>

    <!-- Final Answer Assembler -->
    <rect x="30" y="435" width="380" height="35" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
    <text x="220" y="457" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700">Synthesize Final Deterministic Output Contract</text>
  </g>

  <!-- Right: Egress & Verification Layer -->
  <g transform="translate(795, 115)" filter="url(#shadow-arch)">
    <rect width="240" height="480" rx="12" fill="url(#box-grad-dark)" stroke="#334155" stroke-width="1.2"/>
    <text x="120" y="30" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="700">3. Egress &amp; Verification</text>
    <line x1="20" y1="45" x2="220" y2="45" stroke="#334155" stroke-width="1"/>

    <!-- Micro-boxes -->
    <rect x="20" y="65" width="200" height="50" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
    <text x="120" y="88" text-anchor="middle" fill="#f87171" font-size="11" font-weight="700">Output Hallucination Guard</text>
    <text x="120" y="104" text-anchor="middle" fill="#64748b" font-size="10">Grounding check against facts</text>

    <rect x="20" y="135" width="200" height="50" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="120" y="158" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="700">HITL Gatekeeper</text>
    <text x="120" y="174" text-anchor="middle" fill="#64748b" font-size="10">Action risk escalation evaluator</text>

    <rect x="20" y="205" width="200" height="50" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="120" y="228" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">State Checkpointing</text>
    <text x="120" y="244" text-anchor="middle" fill="#64748b" font-size="10">Commit trajectory to ACID DB</text>

    <rect x="20" y="275" width="200" height="50" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="120" y="298" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">Structured Response Serializer</text>
    <text x="120" y="314" text-anchor="middle" fill="#64748b" font-size="10">JSON / SSE Streaming output</text>

    <rect x="20" y="345" width="200" height="100" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="120" y="372" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">Observability Spans Sent</text>
    <text x="120" y="393" text-anchor="middle" fill="#94a3b8" font-size="10">&bull; Tokens burned (Input/Output)</text>
    <text x="120" y="410" text-anchor="middle" fill="#94a3b8" font-size="10">&bull; Latency per turn (ms)</text>
    <text x="120" y="427" text-anchor="middle" fill="#94a3b8" font-size="10">&bull; Estimated Dollar Cost</text>
  </g>

  <!-- Connective arrows between columns -->
  <line x1="295" y1="140" x2="355" y2="140" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="765" y1="452" x2="815" y2="452" stroke="#10b981" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- Footer Insight -->
  <text x="550" y="650" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">Architectural Reality: An enterprise agent is an event-driven microservice whose core processing happens to be probabilistic, bounded by deterministic code.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="100%" height="100%" style="background:#0b0f19; font-family:'Inter',system-ui,sans-serif;">
  <defs>
    <linearGradient id="curve-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow-f3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="550" y="38" text-anchor="middle" fill="#38bdf8" font-size="20" font-weight="800" letter-spacing="1">FIGURE 3: DYNAMIC YIELD ALLOCATION &amp; ZERO-WASTE SPOILAGE MITIGATION</text>
  <text x="550" y="62" text-anchor="middle" fill="#94a3b8" font-size="13">How Autonomous Inventory Agents Drive Perishable Food Shrink from 10% Down to 1.1%</text>

  <!-- Left: The Perishable Decay Lifecycle (Hour 0 to 48 for Meat / Day 1 to 14 for Eggs) -->
  <g transform="translate(50, 95)" filter="url(#shadow-f3)">
    <rect width="520" height="490" rx="12" fill="url(#curve-grad)" stroke="#334155" stroke-width="1.2"/>
    <text x="25" y="32" fill="#fff" font-size="13" font-weight="700">The Perishable Shelf-Life Decay Curve &amp; Agent Actions</text>
    <line x1="25" y1="45" x2="495" y2="45" stroke="#334155" stroke-width="1"/>

    <!-- Phase A: Peak Freshness -->
    <rect x="25" y="60" width="470" height="85" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="40" y="85" fill="#34d399" font-size="12" font-weight="700">Zone 1: Peak Farm Freshness (Hour 0–12 / Day 1–3)</text>
    <text x="40" y="105" fill="#e2e8f0" font-size="11">&bull; Farm intake graded &amp; chilled at 1.8°C; full retail premium pricing.</text>
    <text x="40" y="123" fill="#a7f3d0" font-size="10">Agent Action: Prioritized for premium subscription customers &amp; gourmet cuts.</text>

    <!-- Phase B: Standard Shelf Life -->
    <rect x="25" y="160" width="470" height="85" rx="6" fill="#1e3a8a" stroke="#38bdf8" stroke-width="1"/>
    <text x="40" y="185" fill="#38bdf8" font-size="12" font-weight="700">Zone 2: Prime Consumption Window (Hour 12–28 / Day 4–7)</text>
    <text x="40" y="205" fill="#e2e8f0" font-size="11">&bull; Standard dark store inventory; high velocity turnover.</text>
    <text x="40" y="223" fill="#bfdbfe" font-size="10">Agent Action: Matched via FEFO algorithm for regular WhatsApp and app orders.</text>

    <!-- Phase C: Proactive Promotion Window -->
    <rect x="25" y="260" width="470" height="95" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
    <text x="40" y="285" fill="#fbbf24" font-size="12" font-weight="700">Zone 3: Proactive Yield Balancing (Hour 28–38 / Day 8–10)</text>
    <text x="40" y="305" fill="#e2e8f0" font-size="11">&bull; Product is 100% wholesome, but inventory velocity lags forecast.</text>
    <text x="40" y="323" fill="#fde68a" font-size="10">Agent Action: Automatically triggers WhatsApp recipe bundling:</text>
    <text x="40" y="339" fill="#fde68a" font-size="10"><em>"Cooking dinner tonight? Add 1 dozen eggs to your order for 25% off!"</em></text>

    <!-- Phase D: Value-Added Repurposing / Flash Sale -->
    <rect x="25" y="370" width="470" height="95" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
    <text x="40" y="395" fill="#f87171" font-size="12" font-weight="700">Zone 4: Zero-Waste Repurposing (Hour 38–48 / Day 11–12)</text>
    <text x="40" y="415" fill="#e2e8f0" font-size="11">&bull; 10 hours before strict internal cull cutoff.</text>
    <text x="40" y="433" fill="#fca5a5" font-size="10">Agent Action: Re-routes raw chicken cuts to in-house commercial kitchen</text>
    <text x="40" y="449" fill="#fca5a5" font-size="10">for immediate blast-chilled marination &amp; ready-to-cook kebabs (Zero Wastage!).</text>
  </g>

  <!-- Right: Traditional E-Commerce vs Autonomous Agent Results -->
  <g transform="translate(600, 95)" filter="url(#shadow-f3)">
    <rect width="450" height="490" rx="12" fill="url(#curve-grad)" stroke="#10b981" stroke-width="1.2"/>
    <text x="25" y="32" fill="#34d399" font-size="14" font-weight="700">The Economic Impact: Traditional vs Agentic</text>
    <line x1="25" y1="45" x2="425" y2="45" stroke="#334155" stroke-width="1"/>

    <!-- Comparison 1: Spoilage / Shrink Rate -->
    <rect x="20" y="65" width="410" height="85" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
    <text x="35" y="88" fill="#f87171" font-size="11" font-weight="700">Perishable Spoilage &amp; Shrink Rate</text>
    <text x="35" y="108" fill="#cbd5e1" font-size="11">Traditional D2C / Supermarket: <strong style="fill:#ef4444;">8.5% – 12.0%</strong> waste</text>
    <text x="35" y="126" fill="#34d399" font-size="11">With Autonomous Agent Mesh: <strong style="fill:#34d399;">1.1% – 1.4%</strong> waste</text>
    <text x="35" y="140" fill="#a7f3d0" font-size="9 font-style:italic;">88% reduction in discarded inventory!</text>

    <!-- Comparison 2: Out of Stock (Stockouts) -->
    <rect x="20" y="165" width="410" height="85" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="35" y="188" fill="#fbbf24" font-size="11" font-weight="700">Out-of-Stock (Stockout) Cancellations</text>
    <text x="35" y="208" fill="#cbd5e1" font-size="11">Traditional E-Commerce: <strong style="fill:#fbbf24;">6.8%</strong> cart abandonment</text>
    <text x="35" y="226" fill="#34d399" font-size="11">With Agent Dynamic Substitution: <strong style="fill:#34d399;">0.4%</strong> cancellations</text>
    <text x="35" y="240" fill="#a7f3d0" font-size="9 font-style:italic;">Smart culinary cut substitutions accepted by 92% of users.</text>

    <!-- Comparison 3: Repeat Order Retention (LTV) -->
    <rect x="20" y="265" width="410" height="85" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="35" y="288" fill="#38bdf8" font-size="11" font-weight="700">Customer Retention &amp; Repeat Purchase Frequency</text>
    <text x="35" y="308" fill="#cbd5e1" font-size="11">Traditional App Interface: <strong style="fill:#94a3b8;">1.8 orders</strong> / month</text>
    <text x="35" y="326" fill="#34d399" font-size="11">With WhatsApp Conversational Agent: <strong style="fill:#34d399;">4.6 orders</strong> / month</text>
    <text x="35" y="340" fill="#a7f3d0" font-size="9 font-style:italic;">Frictionless conversational reordering drives 2.5x higher LTV.</text>

    <!-- Comparison 4: Net Margin Expansion -->
    <rect x="20" y="365" width="410" height="95" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
    <text x="35" y="390" fill="#34d399" font-size="12" font-weight="800">Net EBITDA Margin Expansion</text>
    <text x="35" y="410" fill="#e2e8f0" font-size="11">By slashing inventory shrink from 10% to 1.1% and doubling repeat order frequency, an enterprise fresh food brand expands gross margin by <strong>+820 basis points</strong>.</text>
  </g>

  <!-- Footer Insight -->
  <text x="550" y="615" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">Strategic Takeaway: In fresh food, profitability is won or lost in inventory shelf-life management. AI agents turn spoilage into profit.</text>
</svg>

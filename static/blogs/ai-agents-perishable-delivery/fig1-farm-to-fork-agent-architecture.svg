<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%" style="background:#0b0f19; font-family:'Inter',system-ui,sans-serif;">
  <defs>
    <linearGradient id="card-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="agent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow-f1" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="550" y="38" text-anchor="middle" fill="#38bdf8" font-size="20" font-weight="800" letter-spacing="1">FIGURE 1: THE AUTONOMOUS FARM-TO-FORK ENTERPRISE AGENT ARCHITECTURE</text>
  <text x="550" y="62" text-anchor="middle" fill="#94a3b8" font-size="13">Orchestrating Farm Yield, Cold-Chain dark stores, WhatsApp Commerce &amp; 60-Minute Home Delivery</text>

  <!-- Layer 1: Ingress Channels (Top) -->
  <rect x="50" y="85" width="1000" height="75" rx="10" fill="url(#card-dark)" stroke="#334155" stroke-width="1.2" filter="url(#shadow-f1)"/>
  <rect x="65" y="75" width="220" height="22" rx="4" fill="#0284c7"/>
  <text x="75" y="90" fill="#fff" font-size="10" font-weight="800">1. CUSTOMER INGRESS CHANNELS</text>

  <g transform="translate(70, 108)">
    <rect width="210" height="38" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
    <text x="105" y="24" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="700">WhatsApp Conversational Commerce</text>
  </g>
  <g transform="translate(320, 108)">
    <rect width="210" height="38" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="105" y="24" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">Native iOS / Android Mobile App</text>
  </g>
  <g transform="translate(570, 108)">
    <rect width="210" height="38" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="105" y="24" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">Voice Ordering Assistant (Regional)</text>
  </g>
  <g transform="translate(820, 108)">
    <rect width="210" height="38" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="105" y="24" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="700">Automated Daily Egg Subscription</text>
  </g>

  <!-- Connective Arrows -->
  <line x1="550" y1="160" x2="550" y2="185" stroke="#38bdf8" stroke-width="2"/>

  <!-- Layer 2: Core Multi-Agent Collaborative Mesh (Center) -->
  <rect x="50" y="185" width="1000" height="300" rx="14" fill="rgba(30, 41, 59, 0.45)" stroke="#6366f1" stroke-width="1.8" filter="url(#shadow-f1)"/>
  <rect x="65" y="173" width="350" height="24" rx="6" fill="#4f46e5"/>
  <text x="80" y="189" fill="#fff" font-size="11" font-weight="800">2. ENTERPRISE MULTI-AGENT ORCHESTRATION MESH</text>

  <!-- Agent 1: Customer Commerce & Cut Specialist -->
  <g transform="translate(70, 215)">
    <rect width="220" height="245" rx="8" fill="url(#agent-grad)" stroke="#22c55e" stroke-width="1.2"/>
    <rect x="0" y="0" width="220" height="30" rx="8" fill="#15803d"/>
    <text x="110" y="20" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Customer Commerce Agent</text>
    <text x="15" y="55" fill="#f8fafc" font-size="10" font-weight="600">Core Capabilities:</text>
    <text x="15" y="75" fill="#94a3b8" font-size="9">&bull; Parses cuts (Curry, Biryani, Boneless)</text>
    <text x="15" y="93" fill="#94a3b8" font-size="9">&bull; Egg grading (Organic Brown, Country)</text>
    <text x="15" y="111" fill="#94a3b8" font-size="9">&bull; Recipe bundling (Eggs + Chicken + Marinades)</text>
    <text x="15" y="129" fill="#94a3b8" font-size="9">&bull; Dynamic address geolocation parsing</text>
    <rect x="15" y="150" width="190" height="45" rx="4" fill="#0f172a" stroke="#22c55e"/>
    <text x="105" y="170" text-anchor="middle" fill="#4ade80" font-size="9" font-weight="700">Tool: create_order_draft()</text>
    <text x="105" y="185" text-anchor="middle" fill="#64748b" font-size="8">Pydantic validated order schema</text>
    <text x="15" y="215" fill="#22c55e" font-size="9" font-weight="600">Turn SLA: &lt; 1.2s on WhatsApp</text>
  </g>

  <!-- Agent 2: Inventory, Yield & Spoilage Agent -->
  <g transform="translate(315, 215)">
    <rect width="220" height="245" rx="8" fill="url(#agent-grad)" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="0" y="0" width="220" height="30" rx="8" fill="#b45309"/>
    <text x="110" y="20" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Inventory &amp; Spoilage Agent</text>
    <text x="15" y="55" fill="#f8fafc" font-size="10" font-weight="600">Core Capabilities:</text>
    <text x="15" y="75" fill="#94a3b8" font-size="9">&bull; Hyper-local dark store stock check</text>
    <text x="15" y="93" fill="#94a3b8" font-size="9">&bull; First-Expiring-First-Out (FEFO) lock</text>
    <text x="15" y="111" fill="#94a3b8" font-size="9">&bull; Dynamic markdown on aging cuts</text>
    <text x="15" y="129" fill="#94a3b8" font-size="9">&bull; Farm egg collection intake sync</text>
    <rect x="15" y="150" width="190" height="45" rx="4" fill="#0f172a" stroke="#f59e0b"/>
    <text x="105" y="170" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="700">Tool: reserve_fresh_batch()</text>
    <text x="105" y="185" text-anchor="middle" fill="#64748b" font-size="8">Atomic reservation across hubs</text>
    <text x="15" y="215" fill="#fbbf24" font-size="9" font-weight="600">Wastage Target: &lt; 1.2% total shrink</text>
  </g>

  <!-- Agent 3: Cold-Chain & Dispatch Agent -->
  <g transform="translate(560, 215)">
    <rect width="220" height="245" rx="8" fill="url(#agent-grad)" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="0" y="0" width="220" height="30" rx="8" fill="#0284c7"/>
    <text x="110" y="20" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Cold-Chain &amp; Routing Agent</text>
    <text x="15" y="55" fill="#f8fafc" font-size="10" font-weight="600">Core Capabilities:</text>
    <text x="15" y="75" fill="#94a3b8" font-size="9">&bull; IoT thermal probe telemetry (&lt; 4°C)</text>
    <text x="15" y="93" fill="#94a3b8" font-size="9">&bull; Multi-order delivery rider clustering</text>
    <text x="15" y="111" fill="#94a3b8" font-size="9">&bull; Traffic &amp; weather routing algorithms</text>
    <text x="15" y="129" fill="#94a3b8" font-size="9">&bull; Insulated delivery pack validation</text>
    <rect x="15" y="150" width="190" height="45" rx="4" fill="#0f172a" stroke="#38bdf8"/>
    <text x="105" y="170" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="700">Tool: assign_rider_route()</text>
    <text x="105" y="185" text-anchor="middle" fill="#64748b" font-size="8">Thermal verification + geo-routing</text>
    <text x="15" y="215" fill="#38bdf8" font-size="9" font-weight="600">SLA: Delivery strictly &lt; 60 mins</text>
  </g>

  <!-- Agent 4: Retention & Anomaly Agent -->
  <g transform="translate(805, 215)">
    <rect width="220" height="245" rx="8" fill="url(#agent-grad)" stroke="#ec4899" stroke-width="1.2"/>
    <rect x="0" y="0" width="220" height="30" rx="8" fill="#be185d"/>
    <text x="110" y="20" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Substitution &amp; Care Agent</text>
    <text x="15" y="55" fill="#f8fafc" font-size="10" font-weight="600">Core Capabilities:</text>
    <text x="15" y="75" fill="#94a3b8" font-size="9">&bull; Out-of-stock smart substitution</text>
    <text x="15" y="93" fill="#94a3b8" font-size="9">&bull; Real-time WhatsApp delay alerts</text>
    <text x="15" y="111" fill="#94a3b8" font-size="9">&bull; Automatic refund / credit issuance</text>
    <text x="15" y="129" fill="#94a3b8" font-size="9">&bull; Post-meal freshness rating capture</text>
    <rect x="15" y="150" width="190" height="45" rx="4" fill="#0f172a" stroke="#ec4899"/>
    <text x="105" y="170" text-anchor="middle" fill="#f472b6" font-size="9" font-weight="700">Tool: issue_instant_credit()</text>
    <text x="105" y="185" text-anchor="middle" fill="#64748b" font-size="8">Capped by Tier 2 HITL threshold</text>
    <text x="15" y="215" fill="#f472b6" font-size="9" font-weight="600">Satisfaction: 4.8 / 5.0 CSAT rating</text>
  </g>

  <!-- Connective Arrows -->
  <line x1="550" y1="485" x2="550" y2="515" stroke="#38bdf8" stroke-width="2"/>

  <!-- Layer 3: Physical Systems & IoT Integration (Bottom) -->
  <rect x="50" y="515" width="1000" height="120" rx="10" fill="url(#card-dark)" stroke="#334155" stroke-width="1.2" filter="url(#shadow-f1)"/>
  <rect x="65" y="505" width="260" height="22" rx="4" fill="#059669"/>
  <text x="75" y="520" fill="#fff" font-size="10" font-weight="800">3. PHYSICAL OPERATIONS &amp; IOT TELEMETRY</text>

  <g transform="translate(70, 540)">
    <rect width="210" height="75" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="105" y="22" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">Farm IoT &amp; Processing</text>
    <text x="15" y="42" fill="#94a3b8" font-size="9">&bull; Egg grading &amp; candling sensors</text>
    <text x="15" y="58" fill="#94a3b8" font-size="9">&bull; Batch RFID tagging &amp; chilling logs</text>
  </g>

  <g transform="translate(320, 540)">
    <rect width="210" height="75" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="105" y="22" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">Micro-Hub (Dark Store) WMS</text>
    <text x="15" y="42" fill="#94a3b8" font-size="9">&bull; Cold room monitoring (0°C to 4°C)</text>
    <text x="15" y="58" fill="#94a3b8" font-size="9">&bull; Barcode scan &amp; weight validation</text>
  </g>

  <g transform="translate(570, 540)">
    <rect width="210" height="75" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="105" y="22" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">Rider Fleet Logistics App</text>
    <text x="15" y="42" fill="#94a3b8" font-size="9">&bull; BLE temperature probe in bag</text>
    <text x="15" y="58" fill="#94a3b8" font-size="9">&bull; Real-time GPS &amp; doorstep delivery OTP</text>
  </g>

  <g transform="translate(820, 540)">
    <rect width="210" height="75" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="105" y="22" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="700">Enterprise ERP &amp; Payments</text>
    <text x="15" y="42" fill="#94a3b8" font-size="9">&bull; Razorpay / UPI intent capture</text>
    <text x="15" y="58" fill="#94a3b8" font-size="9">&bull; SAP / Odoo inventory ledger</text>
  </g>

  <!-- Footer Tagline -->
  <text x="550" y="660" text-anchor="middle" fill="#64748b" font-size="10" font-style="italic">Enterprise Insight: In fresh food, an agent is not a chatbot—it is an end-to-end autonomous supply chain orchestrator.</text>
</svg>
